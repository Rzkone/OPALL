 .top{backdrop-filter:none;-webkit-backdrop-filter:none}
 .top .navq{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;gap:4px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
 .navq button{width:42px;height:42px}
 body{padding-bottom:78px}
 .toast{bottom:90px}
 .top .navtoggle{grid-area:nav;justify-content:flex-start}
 .top #roleSel{grid-area:role;justify-self:end;width:172px;font-size:13px;text-overflow:ellipsis}
 .top .dd{justify-self:end}
 .top .search,.top .trend{max-width:none;justify-self:stretch}
 .top .trend{padding-bottom:2px}
 .top .trend .chip{padding:6px 14px;font-size:13px}
 .navtoggle{white-space:nowrap}
 .brand small{letter-spacing:.1em;font-size:8.5px;white-space:nowrap}
 .brand b{letter-spacing:.28em}
 .brand{gap:10px}

 .modal{padding:18px;border-radius:16px}

@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@media(prefers-reduced-motion:no-preference){#btnMic.rec{animation:ring 1.2s infinite}}

/* stamp governance */
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}
.stamp b{color:var(--tx);font-weight:600}
.stamp.ok{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.stamp.ok b{color:inherit}
.stamp.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.stamp.warn b{color:inherit}
.stamp .ic{width:14px;height:14px}
.stamps .btn{padding:4px 10px;font-size:12px;min-height:0}
/* micro-interaksi */
.toast{display:flex;align-items:center;gap:9px;animation:tin .18s ease-out}
.toast .ti{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;background:color-mix(in srgb,var(--bg) 22%,transparent);flex:none}
.toast.ok .ti{background:var(--acc);color:var(--accfilltx)}
.toast.warn .ti{background:var(--warn);color:#fff}
.toast.err .ti{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.fresh{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 24px);padding:10px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--panel);color:var(--tx);box-shadow:var(--shadow);font-size:14px}.fresh[hidden]{display:none}.fresh .btn{white-space:nowrap}
.orb{transition:filter .25s}.orb.ok{filter:drop-shadow(0 0 7px var(--acc)) drop-shadow(0 0 14px color-mix(in srgb,var(--acc) 60%,transparent))}.orb.warn{filter:drop-shadow(0 0 7px var(--warn)) drop-shadow(0 0 14px color-mix(in srgb,var(--warn) 60%,transparent))}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mut);white-space:nowrap;transition:color .2s,border-color .2s,background .2s,box-shadow .35s}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mut);transition:background .2s}
.live.ok{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent),0 0 14px color-mix(in srgb,var(--acc) 45%,transparent)}
.live.ok i{background:var(--acc)}
.live.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent),0 0 14px color-mix(in srgb,var(--warn) 45%,transparent)}
.live.warn i{background:var(--warn)}
.copied{outline:2px solid var(--acc);outline-offset:2px}
.copied::after{content:" ✔";font-weight:700}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.live{transition:none}}
@media(max-width:560px){.live span{display:none}.live{padding:6px}}

<script>
(()=>{'use strict';
/* ====================== KONFIGURASI ====================== */
const CONFIG={
  KEY:'opal.v1',
  HOL_URL:'holidays.json',            // daftar tanggal merah terbitan Admin (opsional)
  KB_URL:'knowledge.json',            // jika file ini ada di folder yang sama, dipakai sebagai basis pengetahuan terbit
  // PERINGATAN: PIN di bawah hanya pembatas tampilan (client-side), BUKAN keamanan. Ganti sebelum dibagikan,
  // dan jangan anggap cukup untuk melindungi data. Keamanan nyata butuh login di sisi server.
  PINS:{agent:'0000',tl:'1111',trainer:'2222',admin:'3333'}
};
const GROUPS={pendaftaran:'Pendaftaran',produk:'Produk',pembayaran:'Pembayaran',perubahan:'Perubahan Layanan',gangguan:'Gangguan',mitra:'Mitra'};
const GROUPS_HIDDEN={mitra:true}; // grup disembunyikan dari menu dan beranda, kartunya tetap bisa dicari
const ROLES={agent:'Agent',tl:'TL/DC/TS',trainer:'Trainer/QA',admin:'Koordinator / Admin'};
const ROLE_SHORT={agent:'Agent',tl:'TL/DC/TS',trainer:'Trainer/QA',admin:'Admin'};

/* ====================== DATA AWAL (SEED) ====================== */
const ICRM=['Status Berlangganan: Aktif','Status Layanan: Aktif / Unisolir','Status Billing: Lunas'];
const P_WA='Mohon informasikan nomor telepon alternatif yang dapat kami hubungi, untuk mempermudah apabila diperlukan konfirmasi lebih lanjut.';
const P_SINCE='Sejak kapan kendala mulai terjadi?';
const P_RESTART='Apakah sudah mencoba restart atau mematikan dan menghidupkan kembali modem?';
const NN=['belum','Belum ada tiket open'],NS=['sudah','Sudah ada tiket open'];
const Q_OPEN={key:'open',label:'Pilih kondisi pelanggan',opts:[NN,NS]};
const Q_KOND=(ins)=>({key:'kondisi',label:'Pilih kondisi pelanggan',opts:[
  ['a','Belum ada tiket reboot ACS (24 jam terakhir) & belum ada tiket open'],
  ['b','Sudah ada tiket reboot ACS (24 jam terakhir) & belum ada tiket open'],
  ['c','Sudah ada tiket open & belum ada '+ins],
  ['d','Sudah ada tiket open & sudah ada '+ins]]});
const D2=(pre,edu)=>(pre?pre+'\n':'')+'Nomor alternatif: 08xxxxx\nBilling: Lunas\nStatus: Unisolir\n'+edu;
const D_UPD='Mohon dibantu update progres dan percepatan perbaikan tersebut, karena pelanggan sudah menghubungi kembali menanyakan gangguan yang dialami. Terima kasih.';
const D_REBOOT='Pelanggan kendala internet, CSO bantu reboot melalui ACS dan edukasi pelanggan menunggu 5-10 menit ke depan.';
const tk=(kategori,tujuan,mode)=>({kategori,tujuan,mode:mode||'baru'});
const UPD={label:'Sudah ada tiket open',when:{open:'sudah'},steps:['Update pada tiket open.'],ticket:tk('Update pada tiket open','','update'),desc1:D_UPD,desc2:''};

function acsCard(o){ // 4 kondisi (A-D) untuk No Internet & Internet Slow
  const k='Gangguan — '+o.kat, T='NOC Ritel Pusat';
  const refresh=['Lakukan Refresh ACS pelanggan, lalu ikuti salah satu hasil di bawah.'];
  return [
   {label:'Belum ada tiket reboot ACS (24 jam) & belum ada tiket open',when:{kondisi:'a'},steps:refresh,ticket:tk('','','update'),desc1:'',desc2:'',variants:[
     {label:'Jika Refresh ACS berhasil',steps:['Lakukan Reboot by ACS.','Buat tiket "Informasi — Reboot by System ACS" dan tutup (Closed by CSO).'],ticket:tk('Informasi — Reboot by System ACS','Closed by CSO','tutup'),desc1:D_REBOOT,desc2:''},
     {label:'Jika Refresh ACS gagal',steps:['Buat tiket '+k+'.','Lampirkan bukti ACS failed to refresh.'],ticket:tk(k,T),desc1:o.d1,desc2:D2('ACS failed to refresh (bukti terlampir)',o.edu)}]},

function trCli(txt){
  if(!/receive power|optical/i.test(txt))return null;
  const m=txt.match(/(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]*$/m);
  if(!m)return null;
  const [rx,hA,hW,lW,lA]=m.slice(1).map(Number);
  if(!(hA>=hW&&hW>=lW&&lW>=lA))return null;
  const ok=rx<=hW&&rx>=lW;
  return{id:'sig',n:'Level sinyal (CLI)',slot:'result',t:ok?'kualitas sinyal pada jalur penghubung perangkat berada dalam batas normal':'kualitas sinyal pada jalur penghubung perangkat menurun'};
}
const TR_SKIPLN=/^\W*\d+\.\s|#|optical|threshold|line protocol|description|\d{3,}|\d+\/\d+|^\W*(tanggal|kategori|teknologi|desain|pop \d|analisa|cek redaman|alokasi|estimasi|laporan \/|rootcause|action|persiapan|perjalanan|perizinan|investigasi|material|recovery|resume|hasil invest|summary|update progress|perapihan|data core|penyebab|koordinat)|\b(senin|selasa|rabu|kamis|jumat|sabtu|minggu),|-?\d{1,3}[.,]\d{4,}|https?:|dbm|packet|ping/;
function trUnknown(txt){
  const out=[];
  txt.split(/\n/).forEach(l=>{
    const ln=l.trim().toLowerCase().replace(/[–—]/g,'-');
    if(ln.length<12||(ln.match(/[a-z]/g)||[]).length<8||TR_SKIPLN.test(ln))return;
    if(TR_RULES.some(r=>r.re[0].test(ln))||TR_INTERNAL.test(ln))return;
    const k=ln.replace(/\s+/g,' ').slice(0,120);
    if(!out.includes(k))out.push(k);
  });
  return out.slice(0,8);
}
const trCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function trTranslate(raw){
  const txt=String(raw||'');
  const N=txt.toLowerCase().replace(/[–—]/g,'-').replace(/\s*\n\s*/g,' | ').replace(/[ \t_]+/g,' ').trim();
  if(!N)return{text:'',unk:[],hit:[],state:'empty'};
  const letters=(txt.match(/[a-zA-Z]/g)||[]).length,words=(txt.match(/[a-zA-Z]{3,}/g)||[]).length;
  if(/[\u0000-\u0008\u000e-\u001f\ufffd]/.test(txt)||words<2||letters<txt.replace(/\s/g,'').length*0.35)return{text:'',unk:[],hit:[],state:'invalid'};
  let M=TR_RULES.filter(r=>r.re.every(x=>x.test(N))&&!(r.not||[]).some(x=>x.test(N)));
  const cli=trCli(txt);if(cli)M.push(cli);
  const sup=new Set();M.forEach(r=>(r.sup||[]).forEach(i=>sup.add(i)));
  M=M.filter(r=>!sup.has(r.id));
  const ids=new Set(M.map(r=>r.id));
  M=M.filter(r=>!(r.skip||[]).some(i=>ids.has(i)));
  const unk=trUnknown(txt);
  if(!M.length){
    if(TR_INTERNAL.test(N))return{text:'',unk:[],hit:[],state:'internal'};
    return{text:TR_GENERIC,unk,hit:[],state:'unknown'};
  }
  const has=i=>M.some(r=>r.id===i);
  const by=s=>M.filter(r=>r.slot===s).map(r=>r.t);
  const prep=by('prep'),found=by('found'),cause=by('cause'),act=by('action'),res=by('result'),ind=by('ind');
  const S=[];
  if(!prep.length&&!found.length&&!cause.length&&!act.length&&!res.length){
    ind.forEach(t=>S.push(trCap(t)+'.'));S.push('Tim sedang memeriksa dan kami akan menginformasikan perkembangannya.');
  }else{
    prep.forEach(t=>S.push(trCap(t)+'.'));
    const pre=prep.length&&found.length?'Hasil pengecekan: ':'';
    if(found.length){
      found.forEach(t=>S.push(pre?pre+t+'.':trCap(t)+'.'));
    }
    cause.forEach(t=>S.push(trCap(t)+'.'));
    act.forEach(t=>S.push(trCap(t)+'.'));
    res.forEach(t=>S.push(trCap(t)+'.'));
    const done=has('splice')||has('normalkan')||has('kwh-normal');
    if(has('konfirmasi'))S.push('Jika masih ada kendala, mohon kabari kami.');
    else if(!res.length&&done)S.push('Silakan dicek kembali layanannya, dan kabari kami jika masih terkendala.');
    else if(!res.length)S.push(TR_WAIT);
  }
  return{text:S.join(' '),unk,hit:M.map(r=>r.n),state:'ok'};
}

function trGuardMsg(v){
  const w=[];
  if(/\d/.test(v))w.push('angka');
  if(TR_TIME.test(v))w.push('kata waktu atau janji (jam, hari, segera, estimasi)');

/* ====================== PENCARIAN ====================== */
function syncSearch(){const has=!!$('#q').value;$('#searchBox').classList.toggle('has',has);$('#btnClear').hidden=!has}
const SR_STOP=new Set(['tidak','bisa','yang','dan','di','ke','dari','untuk','ada','saya','mau','ingin','apa','itu','ini','nya','pelanggan','dengan','atau','kok','sih','ya','dong']);
function srLev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function search(q){
  const n=norm(q);if(!n)return[];
  const toks=n.split(' ').filter(t=>t.length>1&&!SR_STOP.has(t));
  const ex=condSearch(n,toks);if(ex.length)return ex;
  return cards().filter(c=>c.status!=='usang').map(c=>{
    let s=0;const hits=[];const ct=new Set();const kws=[];
    const nt=norm(c.title);nt.split(' ').forEach(t=>t.length>1&&ct.add(t));
    for(const k of c.keywords||[]){
      const nk=norm(k);if(!nk)continue;
      kws.push([k,nk]);nk.split(' ').forEach(t=>t.length>1&&ct.add(t));
      if(n.includes(nk)){s+=10+nk.length;hits.push(k)}
      else if(n.length>=3&&nk.startsWith(n)){s+=8;hits.push(k)}
    }
    if(nt.includes(n))s+=8;
    let matched=0;const mw=[];
    for(const t of toks){
      let best=0,bw='';
      for(const w of ct){
        let v=0;
        if(w===t)v=3;
        else if(t.length>=3&&w.startsWith(t))v=2;
        else if(t.length>=5&&w.length>=5&&Math.abs(w.length-t.length)<=1&&srLev(t,w)<=1)v=2;
        if(v>best){best=v;bw=w;if(v===3)break}
      }
      if(best){matched++;s+=best*2;mw.push(bw)}
    }
    if(toks.length&&matched===toks.length)s+=4;
    if(!hits.length&&mw.length){for(const w of mw){const f=kws.find(x=>x[1].split(' ').includes(w)||x[1].includes(w));if(f&&!hits.includes(f[0]))hits.push(f[0]);if(hits.length>=3)break}}
    if(s>0)s+=(c.priority||0);
    return{c,s,hits};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6).concat(stateHits(n,toks)).sort((a,b)=>b.s-a.s).slice(0,8);
}
function stateHits(n,toks){
  if(!toks.length)return[];const out=[];
  for(const c of cards()){if(c.status==='usang')continue;
    const items=c.tool?(cdArr(c)||[]).map(x=>({n:x.n,st:{case:x.id}})):(c.branches||[]).filter(b=>b.label&&Object.keys(b.when||{}).length).map(b=>({n:b.label,st:{ans:b.when}}));
    for(const it of items){const nl=norm(it.n),ws=nl.split(/[ -]/),nc=nl.replace(/[ -]/g,'');const sub=nl.includes(n)||nc.includes(n.replace(/[ -]/g,''));
      const m=toks.filter(t=>ws.some(w=>w===t||(t.length>=3&&w.startsWith(t)))||(t.length>=4&&nc.includes(t))).length;
      if(!sub&&m<toks.length)continue;
      out.push({c,s:((m>=2||sub)?30:12)+m*2+(sub?6:0),hits:[it.n],st:it.st,lab:it.n})}}
  return out.sort((a,b)=>b.s-a.s).slice(0,3)}
function showResults(commit){
  const q=$('#q').value.trim(),box=$('#results');
  if(!q){box.hidden=true;S.results=[];return}
  S.results=search(q);
  if(S.hit>=S.results.length)S.hit=0;
  if(!S.results.length){
    box.innerHTML='<div class="none">Tidak ada kartu yang cocok. Hubungi TL On-Duty atau buka <b>Gangguan — Lain-lain</b>.</div>';
    box.hidden=false;
    if(commit){DB.unmatched[norm(q)]=(DB.unmatched[norm(q)]||0)+1;save();logAct('cari-tanpa-hasil',q)}
    return;
  }
  box.innerHTML=S.results.map((r,i)=>`<button data-a="open" data-id="${esc(r.c.id)}"${r.st?` data-st="${esc(JSON.stringify(r.st))}"`:''} class="${i===S.hit?'on':''}">${icoTile(r.c)}<span><b>${esc(GROUPS[r.c.group]||'')} — ${esc(r.c.title)}${r.lab?' › '+esc(r.lab):''}</b><br><small class="hint">${r.lab?'langsung ke kondisi':'cocok: '+esc(r.hits.slice(0,3).join(', '))}</small></span></button>`).join('');
  box.hidden=false;
}

const caseList=c=>{if(!c||c.group==='gangguan')return[];if(PL_DATA[c.tool])return PL_DATA[c.tool].cases.map(x=>({id:x.id,n:x.n}));if(c.tool==='kendala')return KD.map(x=>({id:x.id,n:x.n}));return[]};
const curCase=c=>{const l=caseList(c);if(!l.length)return null;const id=PL_DATA[c.tool]?S.pl.c[c.tool]:S.kd.c;return l.find(x=>x.id===id)||l[0]};
const isTC=(c,id)=>(c.trendCases||[]).includes(id);
function renderChips(){
  const all=cards().filter(c=>c.status!=='usang');
  const a=all.filter(c=>c.trending).map(c=>`<button class="chip" data-a="open" data-id="${esc(c.id)}">${esc(c.short||c.title)}</button>`);
  const b=[];
  all.forEach(c=>{const l=caseList(c);(c.trendCases||[]).forEach(id=>{const x=l.find(y=>y.id===id);if(x)b.push(`<button class="chip" data-a="opentc" data-id="${esc(c.id)}" data-v="${esc(x.id)}" title="${esc((c.short||c.title)+' › '+x.n)}">${esc((c.short||c.title)+' › '+x.n)}</button>`)})});
  const t=a.concat(b);
  $('#trend').innerHTML=t.length?'<span>TRENDING</span>'+t.join(''):'';
}

function knBiayaTxt(c){return c.f?(c.f.length===1&&!c.f[0][0]?'Biaya admin kanal: '+c.f[0][1]:'Biaya admin kanal:\n'+c.f.map(([l,v])=>'- '+l+': '+v).join('\n')):''}
function knUnit(c){return c.u==='KAL'?'Hari kalender termasuk Sabtu, Minggu, dan tanggal merah.':'Hari kerja tidak termasuk Sabtu, Minggu, dan tanggal merah.'}
function knInfo(c){
  const L=['Pembayaran melalui '+c.n];
  if(c.e)L.push('Estimasi kliring (proses pengecekan dan pemindahan uang): '+c.e+' ('+knUnit(c).replace(/\.$/,'').replace(/^H/,'h')+').');
  const b=knBiayaTxt(c);if(b)L.push(b);
  (c.nt||[]).forEach(t=>L.push(t));

function knYears(){return new Set(knHolList().map(x=>+String(x.d||'').slice(0,4)).filter(Boolean))}
const KN_HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],KN_BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const knISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const knFmt=d=>KN_HARI[d.getDay()]+', '+d.getDate()+' '+KN_BLN[d.getMonth()]+' '+d.getFullYear();
const knOff=d=>d.getDay()===0||d.getDay()===6||!!knHM()[knISO(d)];
function knSim(ch,iso){
  if(!ch.e)return null;
  const m=/(\d+)(?:\u2013(\d+))?/.exec(ch.e);if(!m)return null;
  const lo=+m[1],hi=+(m[2]||m[1]),kal=ch.u==='KAL';
  const pt=iso.split('-').map(Number);if(pt.length!==3||pt.some(isNaN))return null;
  const pay=new Date(pt[0],pt[1]-1,pt[2]);
  const add=d=>{const x=new Date(d);x.setDate(x.getDate()+1);return x};
  const skipped=[];
  const at=n=>{let x=new Date(pay);let k=0;while(k<n){x=add(x);if(kal||!knOff(x))k++;else skipped.push(new Date(x))}return x};
  const a=at(lo),b=hi===lo?a:at(hi);
  const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return {pay,a,b,lo,hi,kal,skipped:skipped.filter(x=>knHM()[knISO(x)]),passed:today>b,unc:[...new Set([pay.getFullYear(),b.getFullYear()])].filter(y=>!knYears().has(y))};
}

   '**Paket HEBAT tidak dapat upgrade.** Ketentuan yang sama berlaku bagi pelanggan promo Winback ("Tak Bisa ke Lain Hati") dan program COBA ICONNET. Apabila pelanggan Winback atau COBA ICONNET tetap ingin upgrade atau downgrade, CSO harus proaktif menginformasikan bahwa **promo akan hangus atau harga kembali normal**.',
   '**Tagihan penyesuaian** dikirim ke email terdaftar dan berlaku **1 hari kalender**. Jika terlewat, status otomatis "Batal" dan pelanggan harus mengajukan ulang.',
   '**Masa konfigurasi:** 7 hari (7x24 jam) setelah pembayaran dilakukan dan terpantau lunas di sistem.',
   '**Biaya upgrade** bergantung pada waktu pengajuan. Nominal dan rinciannya dikirim ke email terdaftar.']},
  {h:'Biaya upgrade berdasarkan harga paket',ol:[
   {t:'**Harga bandwidth baru sama dengan atau lebih murah dari harga bandwidth lama:** dikenakan biaya satu kali pembayaran sebesar **Rp50.000** (belum termasuk PPN 11%), berlaku untuk seluruh paket.',sub:[
    'Saat pengajuan, sistem menerbitkan Virtual Account (VA) Rp50.000 melalui billing non-rutin.',
    'Biaya wajib dibayar sebelum proses upgrade, dengan SLA pembayaran di hari yang sama saat kode bayar terbit.',
    'Setelah pembayaran terkonfirmasi, upgrade diproses seperti biasa.']},
   {t:'**Harga bandwidth baru lebih mahal dari harga bandwidth lama:** dikenakan **prorata**.',sub:[
    'Nominal tagihan detail hanya dapat dilihat setelah permohonan upgrade diajukan.']}]},
  {h:'Data yang ditanyakan kepada pelanggan',data:['ID Pelanggan / ID PLN','Nama terdaftar','Email','Bandwidth lama','Bandwidth baru'],note:'Untuk pengajuan melalui contact center atau sales. Jika data sesuai, lakukan AKAD.'},
  {h:'Upgrade mandiri melalui aplikasi MyICON+',ol:['Buka aplikasi MyICON+.','Masuk atau hubungkan akun ICONNET.','Pilih menu **ICONNET** di halaman utama.','Pilih menu **Upgrade Layanan**.','Tentukan paket bandwidth baru (misalnya 35, 50, 100, hingga 150 Mbps).','Gulir ke bagian pengajuan, lalu klik **Upgrade Sekarang**.','Selesaikan pembayaran atau ikuti instruksi pembayaran yang tersedia.']}],
 cases:[
  {id:'ajukan',n:'Mengajukan upgrade',ciri:'Data pelanggan sudah sesuai dan AKAD sudah dilakukan.',tiket:[['Keluhan — Permohonan Upgrade','Sales Ritel SBU']],
   d:['Pelanggan ingin mengajukan permohonan upgrade.','Mohon dibantu tindak lanjut permohonan upgrade bandwidth pelanggan dengan data berikut:\nID Pelanggan / ID PLN: xxxxxx\nNama terdaftar: xxxxxx\nEmail: xxxxxx\nBandwidth lama: xxxxxx\nBandwidth baru: xxxxxx\nNomor alternatif: 08xxxxxx\nTerima kasih.']},
  {id:'belum-tl',n:'Sudah mengajukan, belum ditindaklanjuti',ciri:'Pelanggan sudah mengajukan upgrade namun belum ditindaklanjuti.',tiket:[['Keluhan — Upgrade','Sales Ritel SBU']],
   d:['Pelanggan menanyakan permohonan upgrade yang sudah diajukan.','Merujuk pada tiket permohonan upgrade xxxxxx, pengajuan sudah direspons namun hingga saat ini belum ada tindak lanjut. CSO sudah mengedukasi pelanggan untuk memeriksa email terdaftar secara berkala, baik kotak masuk maupun spam, dan membayar apabila tagihan upgrade sudah terbit. Nomor alternatif: 08xxxxxx. Mohon dibantu tindak lanjut segera. Terima kasih.']},
  {id:'belum-konf',n:'Sudah lunas, belum terkonfigurasi',ciri:'Pelanggan sudah membayar tagihan upgrade, namun bandwidth belum berubah.',tiket:[['Keluhan — Upgrade','CM Ritel Pusat']],
   d:['Pelanggan menanyakan permohonan upgrade yang sudah diajukan.','Pelanggan sudah membayar tagihan upgrade dan pada non rutin ICRM+ terpantau lunas, namun bandwidth belum terkonfigurasi menjadi bandwidth baru. Nomor alternatif: 08xxxxxx. Mohon dibantu konfigurasi bandwidth pelanggan segera. Terima kasih.']},
  {id:'info',n:'Hanya informasi',ciri:'Pelanggan hanya bertanya, tanpa tindak lanjut.',tiket:[['Informasi — Upgrade','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengajukan permohonan upgrade bandwidth. CSO mengedukasi syarat dan ketentuan upgrade yang berlaku.']},
  {id:'bayar',n:'Edukasi pembayaran terlebih dahulu',ciri:'Pelanggan wajib membayar tagihan terlebih dahulu sebelum upgrade dapat diajukan.',tiket:[['Informasi — Upgrade','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengajukan upgrade. CSO mengedukasi pembayaran terlebih dahulu karena terdapat tagihan aktif yang belum dibayarkan.']}]},

dwn:{meta:'Menurunkan kecepatan layanan internet',
 note:'**Contact center wajib melakukan retensi** apabila pelanggan mengajukan downgrade.',
 sections:[
  {h:'Langkah awal: tanyakan alasan dan lakukan retensi',open:'Boleh kami mengetahui alasan pengajuan downgrade layanan ini? Kami sangat menyayangkan apabila downgrade diajukan.',table:{cols:['Alasan pelanggan','Tindakan CSO'],rows:[
   ['**Tekanan finansial atau sensitif harga**','Uraikan selisih harga per hari antara paket saat ini dan paket di bawahnya. Selisih bulanan terlihat besar, tetapi per hari hanya sekitar Rp1.000 sampai Rp2.000, sangat kecil dibanding risiko turunnya kenyamanan. Sampaikan juga bahwa promo aktif akan hilang, dan harga permanen saat ini bisa hilang jika kelak pelanggan ingin upgrade kembali.'],
   ['**Kapasitas dianggap berlebih**','Tanyakan jumlah perangkat yang terhubung setiap hari. Jelaskan bahwa jika kecepatan diturunkan dan semua perangkat dipakai bersamaan, kecepatan terbagi sehingga internet terasa lebih lambat.'],
   ['**Internet lambat, tidak stabil, sering putus atau lagging**','Tanyakan jumlah perangkat yang terhubung setiap hari. Jelaskan dampak penurunan kecepatan seperti di atas. **Tawarkan perbaikan terlebih dahulu:** buat tiket gangguan Internet Slow atau Intermittent ke NOC Ritel Pusat sesuai narasi pelanggan.']]},
   go:[['gg-internet-slow','Buka Internet Slow'],['gg-intermittent','Buka Intermittent']]},
  {h:'Syarat dan ketentuan',ol:[
   '**Sudah terbit tagihan:** CSO mengedukasi pelanggan untuk membayar terlebih dahulu, baik prepaid maupun postpaid.',
   '**Billing postpaid berubah menjadi prepaid** apabila downgrade dilakukan.',
   '**Pengajuan lewat telepon atau inbound:** arahkan ke layanan digital, karena membutuhkan lampiran KTP.',
   '**Paket HEBAT tidak dapat downgrade.** Ketentuan yang sama berlaku bagi pelanggan promo Winback ("Tak Bisa ke Lain Hati") dan program COBA ICONNET. Apabila pelanggan tetap ingin upgrade atau downgrade, CSO harus proaktif menginformasikan bahwa **promo akan hangus atau harga kembali normal**.',
   '**Jadwal konfigurasi:** dilakukan pada **tanggal 24**, baik prepaid maupun postpaid. Tagihan bandwidth baru terbit pada **tanggal 25** sesuai ketentuan fixed date billing prepaid.',
   '**Kode pembayaran tidak memiliki masa kedaluwarsa.**',
   '**Tidak ada perhitungan pro rata** untuk downgrade.']},
  {h:'Data yang ditanyakan kepada pelanggan',data:['Nama','ID Pelanggan','Email','Bandwidth lama','Bandwidth baru','Lampiran foto KTP asli pelanggan terdaftar'],note:'Jika data sesuai, lakukan AKAD.'}],
 internal:{h:'Urutan proses downgrade (internal)',ol:[
  'CSO membuka tiket Keluhan — Permohonan Downgrade ke Sales.',
  'Tim Sales mengajukan di ICRM+ hingga muncul ID Permohonan.',
  'Manager Penjualan dan Aktivasi Ritel menganalisis dan menyetujui pengajuan.',
  'Jika disetujui, dilakukan konfigurasi jaringan sesuai ketentuan berlaku.',
  {t:'Jika tidak disetujui:',sub:['pelanggan tetap menerima email notifikasi;','pelanggan prepaid tetap memakai layanan lama dan menerima tagihan sesuai periodenya;','pelanggan postpaid tidak dialihkan menjadi prepaid.']},
  'Sebelum manager menyetujui, pelanggan masih dapat membatalkan pengajuan melalui SBU atau contact center.',
  'Progres dapat dicek di sub menu **Mutasi** pada ICRM+.']},
 cases:[
  {id:'ajukan',n:'Tetap downgrade setelah retensi',ciri:'Retensi sudah dilakukan, data sesuai, dan AKAD sudah dilakukan.',tiket:[['Keluhan — Permohonan Downgrade','Sales Ritel SBU']],
   d:['Pelanggan ingin mengajukan permohonan downgrade.','Mohon dibantu pengajuan permohonan downgrade bandwidth dengan data berikut:\nNama: xxxxxx\nID Pelanggan: xxxxxx\nEmail: xxxxxx\nBandwidth lama: xxxxxx\nBandwidth baru: xxxxxx\nNomor alternatif: 08xxxxxx\nLampiran foto KTP asli pelanggan terdaftar.\nTerima kasih.']},
  {id:'retensi-ok',n:'Berhasil diretensi',ciri:'Pelanggan membatalkan niat downgrade setelah retensi.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengajukan downgrade layanan dengan alasan xxxxxx. CSO berhasil melakukan tindakan retensi untuk mencegah downgrade.']},
  {id:'retensi-info',n:'Retensi dan edukasi syarat',ciri:'Pelanggan hanya menanyakan syarat dan ketentuan, atau tetap memilih downgrade setelah retensi dan edukasi.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengajukan downgrade layanan dengan alasan xxxxxx. CSO sudah melakukan retensi dan mengedukasi syarat dan ketentuan permohonan downgrade.']},
  {id:'bayar',n:'Edukasi pembayaran terlebih dahulu',ciri:'Pelanggan wajib membayar tagihan terlebih dahulu sebelum downgrade dapat diajukan.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengajukan downgrade. CSO mengedukasi pembayaran terlebih dahulu karena terdapat tagihan aktif yang belum dibayarkan.']},
  {id:'belum-tl',n:'Belum ditindaklanjuti Sales SBU',ciri:'Pelanggan sudah mengajukan, namun ID Permohonan belum terbit pada menu Mutasi ICRM+.',tiket:[['Keluhan — Downgrade','Sales Ritel SBU']],
   d:['Pelanggan menanyakan permohonan downgrade yang sudah diajukan.','Berdasarkan tiket permohonan downgrade xxxxxx, pelanggan sudah mengajukan downgrade namun belum ditindaklanjuti oleh Sales SBU. ID Permohonan belum terbit pada menu Mutasi ICRM+ (bukti terlampir). Nomor alternatif: 08xxxxxx. Mohon dibantu tindak lanjut segera. Terima kasih.']},
  {id:'belum-konf',n:'Belum terkonfigurasi melewati tanggal 24',ciri:'Pada Tracking Opportunity, permohonan belum terkonfigurasi dan sudah melewati tanggal 24.',tiket:[['Keluhan — Downgrade','CM Ritel Pusat']],
   d:['Pelanggan menanyakan permohonan downgrade yang sudah diajukan.','Berdasarkan Tracking Opportunity, permohonan downgrade belum terkonfigurasi dan saat ini sudah melewati tanggal 24. Nomor alternatif: 08xxxxxx. Mohon dibantu konfigurasi bandwidth pelanggan segera. Terima kasih.']},
  {id:'tagihan',n:'Sudah terkonfigurasi, tagihan belum sesuai',ciri:'Bandwidth sudah berubah, namun nominal tagihan belum sesuai.',tiket:[['Keluhan — Billing','Billing Ritel Pusat']],
   d:['Pelanggan menanyakan tagihan yang belum sesuai setelah pengajuan permohonan downgrade.','Layanan pelanggan sudah terkonfigurasi namun nominal tagihan tidak sesuai. CSO sudah membantu simulasi pembayaran (bukti terlampir). Nomor alternatif: 08xxxxxx. Mohon dibantu penyesuaian nominal tagihan pelanggan segera. Terima kasih.']}]},

wf:{meta:'Ganti username SSID dan password Wi-Fi, serta cek jumlah perangkat terhubung',pillLabel:'Kondisi pelanggan',
 note:'Merek ONT pelanggan dilihat pada menu **Teknis** di ICRM+ pelanggan.',
 sections:[
  {h:'Pilihan penanganan',ol:[
   '**Mandiri:** CSO mengedukasi tata cara akses alamat IP modem sesuai merek ONT pelanggan (panduan di bawah).',
   '**Dibantu CSO melalui sistem ACS:** dengan syarat dan ketentuan pada kotak data di bawah.']},
  {h:'Data yang diminta (jalur ACS)',note0:'Hanya untuk pelanggan yang memilih **dibantu CSO melalui ACS**.',data:['ID Pelanggan','Nama terdaftar','Password baru','Username SSID baru','Nomor alternatif'],note:'**Nama terdaftar** dicocokkan dengan ICRM+. **Nomor alternatif** wajib diminta ulang kepada pelanggan.'},
  {h:'Panduan akses modem per merek ONT',brand:true},
  {h:'Jumlah perangkat terhubung yang disarankan per paket',note0:'Gunakan jika pelanggan menanyakan berapa perangkat yang sebaiknya terhubung sesuai kecepatan paket. Angka adalah jumlah perangkat yang disarankan per kegiatan.',
   table:{cols:['Kegiatan','10 Mbps','20 Mbps','35 Mbps','50 Mbps','100 Mbps'],rows:[
    ['**Social Media**','3','5','10','15','25'],
    ['**Streaming**','2','2','4','10','20'],
    ['**Main Game Mobile**','2','3','5','8','15'],
    ['**Main Game PC/Laptop**','1','2','3','5','10'],
    ['**Video Call Mobile**','2','3','5','8','15'],
    ['**Video Call PC/Laptop**','1','1','2','3','6']]}}],
 internal:{h:'Catatan internal',ol:[
  'Tampilan menu modem dapat berbeda antarmodel. Seluruh model dianggap sudah tercakup.',
  'Username dan password baru yang ditulis pada deskripsi tiket bersifat **sensitif**. Tuliskan hanya pada tiket yang membutuhkannya.',
  'Pembatasan jumlah perangkat, pemblokiran perangkat, dan menyembunyikan username SSID belum dapat disarankan.',
  'Pada jalur ACS, perubahan berlaku untuk **2.4G**. Jika pelanggan meminta band 5GHz, ikuti kasus **Meminta band 5GHz**.']},
 cases:[
  {id:'mandiri',n:'Mandiri',ciri:'Pelanggan ingin mengganti password dan/atau username SSID secara mandiri.',
   steps:['Lihat merek ONT pada menu **Teknis** di ICRM+ pelanggan.','Edukasi tata cara akses alamat IP modem sesuai merek menggunakan panduan di atas.','Ingatkan bahwa password baru minimal **8 karakter**, dan semua perangkat akan terputus dari Wi-Fi lalu perlu dihubungkan kembali dengan password baru.','Buat tiket sesuai permintaan pelanggan (ganti password atau ganti username SSID). Jika pelanggan meminta keduanya, buat **salah satu tiket saja**.'],
   tiket:[['Informasi — Ganti Password','Closed by CSO','tutup'],['Informasi — Ganti Username SSID','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengganti password dan/atau username SSID Wi-Fi. CSO sudah mengedukasi tata cara perubahan secara mandiri sesuai merek modem pelanggan.']},
  {id:'acs',n:'Dibantu CSO (ACS) berhasil',ciri:'Data lengkap, AKAD sudah dilakukan, dan perubahan melalui sistem ACS berhasil.',
   steps:['Minta data pada kotak **Data yang diminta (jalur ACS)** di atas.','Cocokkan **nama terdaftar** dengan ICRM+, dan minta ulang **nomor alternatif** kepada pelanggan.','Setelah semua data lengkap, lakukan **AKAD**.','Jika AKAD berhasil, lakukan perubahan langsung melalui **sistem ACS**. Perubahan berlaku untuk **2.4G**, atau 5GHz jika pelanggan memintanya.','Edukasi pelanggan bahwa semua perangkat akan terputus otomatis dari Wi-Fi dan dapat dihubungkan kembali dengan password baru.','Buat tiket sesuai permintaan pelanggan (ganti password atau ganti username SSID). Jika pelanggan meminta keduanya, buat **salah satu tiket saja**.'],
   tiket:[['Informasi — Ganti Password','Closed by CSO','tutup'],['Informasi — Ganti Username SSID','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengganti password dan/atau username SSID Wi-Fi. CSO sudah melakukan AKAD dan perubahan berhasil dilakukan melalui sistem ACS. Pelanggan sudah diedukasi bahwa semua perangkat akan terputus otomatis dan dapat dihubungkan kembali dengan password baru.']},
  {id:'acsgagal',n:'Dibantu CSO (ACS) bermasalah',ciri:'AKAD sudah dilakukan, namun perubahan tidak dapat dilakukan karena kendala pada sistem ACS.',
   steps:['Buat tiket di bawah sesuai permintaan pelanggan (ganti password atau ganti username SSID). Jika pelanggan meminta keduanya, buat **salah satu tiket saja**.'],
   tiket:[['Keluhan — Ganti Password','NOC Ritel Pusat'],['Keluhan — Ganti Username SSID','NOC Ritel Pusat']],
   d:['Pelanggan ingin mengganti password dan/atau username SSID Wi-Fi.','CSO sudah melakukan AKAD, namun perubahan tidak dapat dilakukan karena kendala pada sistem ACS. Mohon dibantu perubahan password dan/atau username SSID pelanggan segera dengan data berikut:\nUsername SSID baru: xxxxxx\nPassword baru: xxxxxx\nBand: 2.4G\nNomor alternatif: 08xxxxxx\nTerima kasih.']},
  {id:'jml',n:'Menanyakan jumlah perangkat terhubung',ciri:'Pelanggan menanyakan berapa banyak perangkat yang terhubung ke Wi-Fi.',
   steps:['Edukasi tata cara cek perangkat terhubung secara mandiri sesuai merek ONT, pada bagian **Cek perangkat terhubung** di panduan di atas.','Jika pelanggan juga menanyakan jumlah perangkat yang ideal, sampaikan tabel **Jumlah perangkat terhubung yang disarankan per paket** di atas.','Buat tiket di bawah. Pastikan hashtag **#JMLDEVICETERHUB** ada pada deskripsi.'],
   tiket:[['Informasi — Lain-lain','Closed by CSO','tutup']],
   d:['Pelanggan menanyakan jumlah perangkat yang terhubung ke Wi-Fi. CSO sudah mengedukasi tata cara pengecekan secara mandiri sesuai merek modem pelanggan. #JMLDEVICETERHUB']},
  {id:'batas',n:'Batasi, blokir perangkat, atau sembunyikan SSID',ciri:'Pelanggan meminta pembatasan jumlah perangkat, pemblokiran perangkat, atau menyembunyikan username SSID.',
   steps:['Sampaikan bahwa permintaan ini **belum dapat disarankan**, karena dikhawatirkan perangkat pelanggan yang digunakan tidak dapat mengakses Wi-Fi.','Permintaan **tidak dapat ditindaklanjuti**.','Buat tiket di bawah.'],
   tiket:[['Informasi — Lain-lain','Closed by CSO','tutup']],
   d:['Pelanggan meminta xxxxxx (pembatasan jumlah perangkat, pemblokiran perangkat, atau menyembunyikan username SSID). CSO sudah menyampaikan bahwa permintaan belum dapat disarankan karena dikhawatirkan perangkat pelanggan tidak dapat mengakses Wi-Fi, sehingga tidak dapat ditindaklanjuti.']},
  {id:'default',n:'Modem ter-reset, username dan password kembali default',ciri:'Setelah probing, modem pelanggan ter-reset sehingga username SSID dan password Wi-Fi kembali ke default.',
   steps:['Lakukan probing, lalu pastikan modem ter-reset (nama Wi-Fi dan password kembali ke default).','CSO dapat menindaklanjuti dengan mengubah username SSID dan password.','Minta data pada kotak **Data yang diminta (jalur ACS)**, cocokkan nama terdaftar dengan ICRM+, minta ulang nomor alternatif, lalu lakukan **AKAD**.','Ubah langsung melalui **sistem ACS**, lalu edukasi bahwa semua perangkat akan terputus otomatis dan dapat dihubungkan kembali dengan password baru.','Jika ACS bermasalah, buat tiket Keluhan pada kasus **Dibantu CSO (ACS) bermasalah**.'],
   tiket:[['Informasi — Ganti Username SSID','Closed by CSO','tutup']],
   d:['Pelanggan modem ter-reset sehingga username SSID dan password Wi-Fi kembali ke default. CSO sudah melakukan AKAD dan mengubah username SSID dan password melalui sistem ACS.']},
  {id:'hilang',n:'Nama Wi-Fi hilang',ciri:'Setelah probing, nama Wi-Fi pelanggan hilang atau tidak terdeteksi.',
   steps:['Lakukan probing, lalu pastikan nama Wi-Fi pelanggan memang tidak terdeteksi.','Buat tiket di bawah untuk meminta SSID dimunculkan kembali. **Tidak perlu AKAD.**'],
   tiket:[['Keluhan — Ganti Username SSID','NOC Ritel Pusat']],
   d:['Pelanggan nama Wi-Fi (username SSID) hilang dan tidak terdeteksi.','Setelah probing, nama Wi-Fi pelanggan memang tidak terdeteksi. Nomor alternatif: 08xxxxxx. Mohon dibantu memunculkan kembali SSID pelanggan segera. Terima kasih.']},
  {id:'g5',n:'Meminta band 5GHz',ciri:'Pelanggan meminta penambahan atau pengaktifan band 5GHz.',
   steps:['Sampaikan penjelasan perbedaan 5G seluler dan 5GHz (salin di bawah).','Tanyakan kepada pelanggan apakah band 5GHz tersebut **sebelumnya pernah aktif** atau **belum pernah aktif**.',{t:'Sesuai jawaban pelanggan:',sub:['**Belum pernah aktif:** jelaskan faktor pendukungnya, yaitu HP dan modem harus mendukung 5GHz. Jika pelanggan tetap ingin diaktifkan, cek dukungan modem melalui **sistem ACS**. Modem mendukung: minta username SSID dan password 5GHz, lakukan **AKAD**, lalu buat tiket di bawah (gunakan **Deskripsi 2 (belum pernah aktif)**). Modem tidak mendukung: sampaikan kepada pelanggan, tiket tidak diperlukan.','**Pernah aktif, lalu tidak aktif dan ingin diaktifkan lagi:** ini indikasi 5GHz sebelumnya pernah diajukan atau dinonaktifkan sendiri oleh pelanggan. Lakukan probing dan pastikan kembali. Jika indikasi 5GHz tidak ditemukan pada sistem ACS, buat tiket di bawah (gunakan **Deskripsi 2 (pernah aktif lalu tidak aktif)**).','**Pernah aktif, tetapi tidak dapat digunakan atau namanya hilang:** ikuti kasus **Nama Wi-Fi hilang** (Keluhan — Ganti Username SSID).']},'Jika HP atau modem tidak mendukung 5GHz, permintaan **tidak dapat ditindaklanjuti**, apalagi ganti modem. Jika pelanggan memaksa ganti modem, ikuti kasus **Menanyakan perbedaan 2,4GHz dan 5GHz**.'],
   tiket:[['Keluhan — Ganti Username SSID','NOC Ritel Pusat']],
   dl:['Penjelasan untuk pelanggan','Deskripsi 1','Deskripsi 2 (belum pernah aktif)','Deskripsi 2 (pernah aktif lalu tidak aktif)'],
   d:['5G pada kartu seluler dan 5GHz pada Wi-Fi itu berbeda. 5G seluler adalah jaringan dari operator seluler untuk internet di HP saat berada di luar rumah. Sedangkan 5GHz adalah salah satu frekuensi Wi-Fi dari modem di rumah. Dibanding 2,4GHz, 5GHz lebih cepat dan lebih stabil, tetapi jangkauannya lebih pendek, sehingga sinyal melemah jika jauh dari modem atau terhalang dinding.',
    'Pelanggan ingin menambahkan band 5GHz pada Wi-Fi.',
    'Pelanggan belum pernah mengaktifkan band 5GHz. Berdasarkan pengecekan melalui sistem ACS, modem pelanggan mendukung band 5GHz. CSO sudah melakukan AKAD. Mohon dibantu penambahan band 5GHz pelanggan segera dengan data berikut:\nUsername SSID 5GHz: xxxxxx\nPassword 5GHz: xxxxxx\nNomor alternatif: 08xxxxxx\nTerima kasih.',
    'Pelanggan sebelumnya pernah mengaktifkan band 5GHz, namun kini tidak aktif dan pelanggan meminta diaktifkan kembali. Setelah probing, CSO sudah melakukan pengecekan melalui sistem ACS dan indikasi band 5GHz tidak ditemukan. Mohon dibantu pengecekan dan pengaktifan kembali band 5GHz pelanggan segera. Nomor alternatif: 08xxxxxx. Terima kasih.']},

rs:{meta:'Pelanggan suspect reselling jaringan ICONNET',pillLabel:'Kondisi pelanggan',fold:true,
 sections:[
  {k:'def',o:true,h:'Pengertian reselling',say:'Sebagai informasi, reselling merupakan kegiatan memperjualbelikan kembali jaringan ICONNET kepada pengguna lain dengan tujuan untuk mendapatkan keuntungan. Kegiatan ini dilarang sesuai UU Nomor 6 Tahun 2023 (penetapan Perppu Nomor 2 Tahun 2022 tentang Cipta Kerja) dan Syarat & Ketentuan Berlangganan ICONNET (https://iconnet.id/panduan/syarat-ketentuan), yang memuat larangan: "Pelanggan dilarang untuk menjual, memanfaatkan atau membagi kembali baik sebagian maupun keseluruhan Layanan ICONNET."'},
  {k:'alur',h:'Alur suspect reselling (internal)',note0:'Informasi internal. **Tidak disampaikan** apa adanya kepada pelanggan.',ol:[
   'Tim NOC Ritel Pusat menginformasikan SBU untuk visit ke lokasi pelanggan yang suspect reselling.',
   'Jika pelanggan **terbukti** reselling, SBU memberikan edukasi dan surat peringatan kepada pelanggan.',
   'Tim NOC Ritel Pusat menurunkan bandwidth menjadi **5 Mbps** jika pelanggan terbukti reselling berdasarkan hasil visit SBU.',
   'Masa berlaku bandwidth baru (5 Mbps) adalah **30 hari kalender** sejak penurunan bandwidth dilakukan.',
   'Bandwidth dikembalikan sesuai kontrak pada **H+1 hari kalender** setelah masa bandwidth 5 Mbps berakhir.',
   'Pelanggan menjadi pantauan NOC Ritel Pusat. Jika terdeteksi reselling kembali, bandwidth diturunkan lagi **tanpa visit** petugas SBU.']}],
 cases:[
  {id:'masih',n:'Internet slow, masih dalam periode penurunan',ciri:'Pelanggan melaporkan internet slow dan teridentifikasi bandwidth diturunkan karena reselling. Masih dalam periode penurunan bandwidth.',open:['alur'],
   steps:['Cek periode penurunan bandwidth pada **sharepoint kertas kerja visit pelanggan**.','Edukasi pelanggan: bandwidth diturunkan menjadi **5 Mbps** selama **30 hari kalender** sejak penurunan dilakukan.','Sampaikan bahwa bandwidth dikembalikan sesuai kontrak pada **H+1 hari kalender** setelah masa 5 Mbps berakhir.','Buat tiket di bawah.'],
   tiket:[['Informasi — Lain-lain','Closed by CSO','tutup']],
   d:['Pelanggan mengalami internet slow. Pelanggan teridentifikasi dikenakan penurunan bandwidth karena reselling dan masih dalam periode penurunan. CSO sudah mengedukasi bahwa bandwidth menjadi 5 Mbps selama 30 hari kalender sejak penurunan dilakukan, dan akan dikembalikan sesuai kontrak pada H+1 hari kalender setelah masa tersebut berakhir.']},
  {id:'lewat',n:'Internet slow, sudah di luar periode penurunan',ciri:'Pelanggan melaporkan internet slow dan teridentifikasi bandwidth pernah diturunkan karena reselling. Sudah di luar periode penurunan bandwidth.',
   steps:['Cek periode penurunan bandwidth pada **sharepoint kertas kerja visit pelanggan**.','Buat tiket di bawah. Informasikan pada deskripsi bahwa pelanggan sudah melewati periode penurunan bandwidth karena reselling.'],
   tiket:[['Gangguan — Internet Slow','NOC Ritel Pusat']],
   d:['Pelanggan mengalami gangguan internet slow sejak xxxxxx.','Pelanggan sudah melewati periode penurunan bandwidth karena reselling. Nomor alternatif: 08xxxxxx. Mohon dibantu pengecekan dan perbaikan segera. Terima kasih.']},
  {id:'tdkada',n:'Internet slow, periode penurunan tidak diketahui',ciri:'Pelanggan melaporkan internet slow dan teridentifikasi bandwidth diturunkan karena reselling, namun tidak ada informasi periode penurunan.',
   steps:['Cek periode penurunan bandwidth pada **sharepoint kertas kerja visit pelanggan**. Informasi periode tidak ditemukan.','Buat tiket di bawah. Informasikan pada deskripsi bahwa periode penurunan bandwidth tidak diketahui.'],
   tiket:[['Gangguan — Internet Slow','NOC Ritel Pusat']],
   d:['Pelanggan mengalami gangguan internet slow sejak xxxxxx.','Pelanggan teridentifikasi dikenakan penurunan bandwidth karena reselling, namun periode penurunan bandwidth tidak diketahui karena tidak ada pada sharepoint kertas kerja visit pelanggan. Nomor alternatif: 08xxxxxx. Mohon dibantu pengecekan dan perbaikan segera. Terima kasih.']},
  {id:'bongkar',n:'Alat penunjang reselling sudah dibongkar',ciri:'Pelanggan melapor dan menginformasikan alat-alat penunjang reselling sudah dibongkar.',
   steps:['Catat kronologis sesuai informasi pelanggan.','Buat tiket di bawah dan tuliskan kronologis pada deskripsi.'],
   tiket:[['Gangguan — Lain-lain','NOC SBU']],
   d:['Pelanggan menginformasikan alat-alat penunjang reselling sudah dibongkar.','Kronologis sesuai informasi pelanggan: xxxxxx. Nomor alternatif: 08xxxxxx. Mohon dibantu tindak lanjut segera. Terima kasih.']}]},

jr:{meta:'Penjelasan sistem bandwidth sharing ICONNET',pillLabel:'Kondisi pelanggan',
 sections:[
  {h:'Penjelasan jenis jaringan',say:'Kami informasikan bahwa layanan ICONNET menggunakan sistem bandwidth sharing dengan kecepatan "up to" (hingga kecepatan tertentu) atau dinamis, tanpa kuota dan tanpa FUP (Fair Usage Policy). Artinya tidak ada pembatasan penggunaan data, namun kecepatan internet yang diterima bersifat dinamis dan dapat berubah-ubah, dipengaruhi oleh beberapa faktor seperti jumlah pengguna aktif pada waktu yang sama, jenis aktivitas internet yang dilakukan (misalnya streaming, download, atau upload), serta kondisi lalu lintas jaringan yang padat pada jam-jam tertentu.\n\nBerbeda dengan layanan dedicated (rasio 1:1) yang diperuntukkan bagi keperluan corporate. Pada layanan dedicated, bandwidth bersifat khusus untuk satu pelanggan dan dijamin (garansi) sesuai ketentuan masing-masing penyedia layanan.'}],
 cases:[
  {id:'info',n:'Menanyakan jenis jaringan',ciri:'Pelanggan menanyakan jenis jaringan, kecepatan yang berubah-ubah, kuota, atau FUP.',
   tiket:[['Informasi — Produk','Closed by CSO','tutup']],
   d:['Pelanggan menanyakan jenis jaringan layanan ICONNET. CSO sudah mengedukasi bahwa layanan menggunakan sistem bandwidth sharing dengan kecepatan up to (dinamis), tanpa kuota dan tanpa FUP.']}]},

em:{meta:'Edukasi pelanggan yang tidak bisa mengakses email lewat aplikasi email kantor atau email client',pillLabel:'Kondisi pelanggan',
 sections:[
  {h:'Penjelasan akses SMTP',say:'Mohon maaf, akses email melalui aplikasi email kantor atau email client (SMTP, Simple Mail Transfer Protocol) tidak dapat kami berikan. Untuk akses yang lebih baik dan lebih aman, Anda disarankan menggunakan akses melalui browser.\n\nHal ini untuk mengantisipasi penyalahgunaan layanan pesan elektronik (spam) secara massal oleh oknum yang tidak bertanggung jawab, yang dapat merugikan pengguna lain.'}],
 cases:[
  {id:'smtp',n:'Tidak bisa akses email client',ciri:'Pelanggan menyampaikan tidak bisa mengakses aplikasi email kantor atau email client.',
   steps:['Pastikan kendala terjadi pada aplikasi email kantor atau email client, bukan pada koneksi internet (jika internet bermasalah, ikuti kartu gangguan yang sesuai).','Edukasi akses SMTP dan sarankan akses melalui browser (kotak salin di atas).','Buat tiket di bawah.'],
   tiket:[['Informasi — Lain-lain','Closed by CSO','tutup']],
   d:['Pelanggan tidak dapat mengakses aplikasi email kantor atau email client. CSO sudah mengedukasi bahwa akses SMTP tidak dapat diberikan, dan menyarankan akses email melalui browser agar lebih aman.']}]},

mtd:{meta:'Pendaftaran mitra ICONNET, pendaftaran pelanggan via PLN Mobile, dan kode referral',pillLabel:'Pertanyaan mitra',

 cases:[
  {id:'daftar',n:'Ingin mendaftar menjadi mitra',ciri:'Calon mitra ingin mendaftar menjadi mitra ICONNET.',
   steps:['Minta data pada kotak **Data yang diminta untuk pendaftaran mitra** di atas. KTP dan foto selfie dapat dilampirkan.','Buat tiket di bawah dan lampirkan data serta dokumen yang diterima.'],
   tiket:[['Keluhan — Lain-lain','Sales Ritel SBU']],
   d:['Calon mitra ingin mendaftar menjadi mitra ICONNET.','Mohon dibantu proses pendaftaran mitra dengan data berikut:\nNama lengkap: xxxxxx\nNIK: xxxxxx\nAlamat lengkap: xxxxxx\nNomor telepon: 08xxxxxx\nNPWP: xxxxxx\nNo rekening: xxxxxx\nNama bank: xxxxxx\nPemilik rekening: xxxxxx\nLampiran: KTP dan foto selfie.\nTerima kasih.']},
  {id:'plnmobile',n:'Cara mendaftarkan pelanggan via PLN Mobile',ciri:'Mitra atau pelanggan menanyakan langkah pendaftaran ICONNET melalui aplikasi PLN Mobile.',
   steps:['Download dan register **PLN Mobile**.','Daftarkan **ID Pelanggan PLN** yang ingin disambung ICONNET.','Pilih menu **Internet**.','Pada menu ICONNET, IDPEL yang didaftarkan dicek ketersediaan layanannya secara manual dengan klik **Cek Area Saya**.',{t:'Hasil pengecekan area:',sub:['**Belum ter-cover:** klik **Beri Tahu Kami** sebagai referensi dan potensi pembangunan coverage.','**Sudah ter-cover:** pilih paket ICONNET yang diinginkan.']},'Isi data pelanggan ICONNET dengan lengkap, dan pastikan **titik lokasi koordinat** sudah sesuai alamat pemasangan.'],
   dl:['Panduan untuk mitra'],
   d:['Langkah pendaftaran ICONNET melalui PLN Mobile:\n1. Download dan register PLN Mobile.\n2. Daftarkan ID Pelanggan PLN yang ingin disambung ICONNET.\n3. Pilih menu Internet.\n4. Pada menu ICONNET, IDPEL yang didaftarkan dicek ketersediaan layanannya secara manual dengan klik "Cek Area Saya".\n5. Jika belum ter-cover, klik "Beri Tahu Kami" sebagai referensi dan potensi pembangunan coverage. Jika sudah ter-cover, pilih paket ICONNET yang diinginkan.\n6. Isi data pelanggan ICONNET dengan lengkap, dan pastikan titik lokasi koordinat sudah sesuai alamat pemasangan.']},

   dl:['Penjelasan untuk mitra'],
   d:['Ketentuan penggunaan Kode Referral ICONNET di PLN Mobile:\n1. Mitra mendapat Kode Referral ICONNET melalui email yang telah didaftarkan.\n2. Kode Referral terdiri atas lima karakter, dengan karakter kedua sebagai identifikasi SBU.\n3. Mitra wajib menginput kode referral pada setiap pendaftaran opportunity ICONNET.\n4. Jika kode referral tidak diisi, komisi tidak bisa diklaim meskipun opportunity sudah COMPLETED.\n5. Kesalahan input kode referral berdampak pada komisi yang tidak dapat dicairkan, meskipun opportunity sudah COMPLETED.\n6. Setiap mitra individu terdaftar hanya memiliki 1 kode referral ICONNET.']}]},

  {k:'proses',h:'Pendaftaran, pembayaran, dan aktivasi',ol:[
   {t:'**Pendaftaran** melalui contact center ICONNET:',sub:['Pendaftaran ICONPLAY pelanggan eksisting.','Pendaftaran bundling ICONNET dan ICONPLAY calon pelanggan. Prosesnya tetap mengikuti alur pendaftaran saat ini (SOP Permohonan Berlangganan Layanan ICONNET Ver.3, 25 Juni 2024).']},
   {t:'**Tagihan awal** berlangganan ICONPLAY:',sub:['Tagihan dikirim melalui email terdaftar.','Kode pembayaran berlaku **7 hari kalender** sejak VA terbit.','Pada bundling, tagihan terbit sesuai alur permohonan pendaftaran baru. Invoice yang diterima calon pelanggan hanya **satu**, dan nominal tagihan otomatis terakumulasi antara tagihan ICONNET dan ICONPLAY.']},
   {t:'**Tagihan bulanan** ICONPLAY:',sub:['Tagihan terbit **30 hari** setelah instalasi dan aktivasi layanan ICONPLAY.','Tagihan muncul **10 hari** sebelum masa aktif habis, dengan kode VA yang sama dengan tagihan bulanan.','Jika pelanggan membayar tagihan ICONPLAY pada atau setelah tanggal terbit tagihan ICONNET, nominal otomatis terakumulasi dengan tagihan ICONNET.']},
   {t:'**SLA pemasangan:** estimasi **3 hari kalender** setelah pembayaran diterima.',sub:[]}]},
  {k:'alat',h:'Perangkat layanan ICONPLAY',note0:'Pada Set Top Box (STB) tertera brand **ICONTV**. Jika pelanggan menanyakannya, informasikan bahwa STB ICONTV sama dengan ICONPLAY.',ol:['Set Top Box (STB) ICONPLAY','Remote Set Top Box (STB) ICONPLAY','Kabel HDMI Set Top Box (STB) ICONPLAY','Adaptor Set Top Box (STB) ICONPLAY','Kabel UTP RJ 45 Set Top Box (STB) ICONPLAY']}],

  {id:'hepi',n:'ICONNET Hard Bundling (HEPI) — hold',ciri:'Pelanggan atau calon pelanggan menanyakan atau mendaftar ICONNET Hard Bundling (HEPI ICONNET x ICONPLAY). Layanan ini berstatus **hold / pending**.',

  {id:'daftar',n:'Pendaftaran ICONPLAY (pending)',ciri:'Pelanggan eksisting atau calon pelanggan (bundling) mengajukan permohonan pendaftaran ICONPLAY. Pendaftaran berstatus pending.',

mi:{meta:'Panduan fitur aplikasi MyICON+ versi 2.07 (Android)',pillLabel:'Pilih topik',fold:true,
 note:'Panduan ini mengacu pada aplikasi **MyICON+ versi 2.07 (Android)**. Tampilan bisa berbeda di versi lain.',
 groups:[['Akses dan akun',['login','hubung','tambahid','akunterhubung']],['Beranda',['beranda','coverage']],['Menu Iconnet',['iconnet','voip','upgrade','nomorbayar','laporan','faq','refund','addon','chat']],['Riwayat dan Profil',['riwayat','profil']]],
 sections:[
  {k:'status',o:true,h:'Tampilan menurut status pengguna',table:{cols:['Status','Menu yang bisa dipakai'],rows:[
   ['**Non pelanggan (belum ada history pengajuan)**','Beranda dan Profil. Menu Iconnet dan Riwayat belum terintegrasi, akun harus dihubungkan dengan email terdaftar.'],
   ['**Non pelanggan (terdapat history pengajuan berlangganan)**','Semua menu. Menu Iconnet tidak menampilkan ID Pelanggan, tidak bisa buat laporan, dan upgrade tidak bisa diajukan. Menu Riwayat hanya menampilkan pengajuan berlangganan.'],
   ['**Pelanggan**','Semua menu dan fitur, termasuk upgrade layanan dan buat laporan.']]}}],
 cases:[
  {id:"login",n:"Login aplikasi",ciri:"Pelanggan atau non pelanggan ICONNET menanyakan cara masuk ke aplikasi MyICON+.",steps:["Install aplikasi MyICON+.", "Buka aplikasi lalu klik **Masuk dengan Google**.", "Input email yang ingin digunakan untuk login.", "Login hanya bisa dengan akun Google. Menu **Keluar** di Profil akan mengeluarkan akun, sehingga harus login kembali dengan akun Google."]},
  {id:"hubung",n:"Menghubungkan akun (menu Iconnet atau Riwayat)",ciri:"Non pelanggan yang belum terdapat history pengajuan berlangganan tidak bisa mengakses menu Iconnet dan Riwayat. Akun harus dihubungkan dengan email terdaftar.",steps:["Pilih menu **Iconnet** (atau **Riwayat**).", "Klik **Masuk dengan email terdaftar**.", "Input email terdaftar, lalu klik **Hubungkan Akun**.", "Menu Riwayat hanya bisa diakses jika terdapat history pengajuan berlangganan, sebelum atau sesudah VA terbit."]},
  {id:"tambahid",n:"Menambah ID Pelanggan",ciri:"Non pelanggan (terdapat history pengajuan) atau pelanggan yang memiliki lebih dari satu ID Pelanggan ingin menambahkan ID Pelanggan.",steps:["Pilih menu **Iconnet**.", "Klik ikon panah bawah di pojok kiri atas (di atas saldo Rp0).", "Klik **+Tambah Pelanggan**, lalu input ID Pelanggan yang ingin ditambahkan.", "Untuk menambahkan ID Pelanggan hanya bisa menggunakan email terdaftar. Klik **Masuk dengan email terdaftar**.", "Input email terdaftar dan klik **Hubungkan Akun**.", "Input kode OTP yang dikirimkan ke email terdaftar."]},
  {id:"akunterhubung",n:"Akun terhubung dan memutus akun",ciri:"Pelanggan ingin melihat email yang terhubung dengan ID Pelanggan atau menghapus email agar tidak terhubung lagi.",steps:["Buka menu **Profil**, lalu pilih **Informasi Akun Terhubung**.", "Halaman hanya menampilkan email pengguna. Klik email pengguna untuk melihat daftar email yang terhubung dengan ID Pelanggan.", "Pada daftar email terdapat ikon (-) untuk menghapus email pengguna. Pengguna tidak bisa menghapus email lain.", "Konfirmasi dengan klik **Ya** pada notifikasi \"Putuskan hubungan dengan akun yang dipilih?\".", "Untuk non pelanggan, halaman ini hanya menampilkan metode pembayaran, namun saat dipilih tidak tertera kode VA."]},
  {id:"beranda",n:"Menu Beranda",ciri:"Pelanggan menanyakan isi menu Beranda. Tampilan Beranda sama untuk non pelanggan dan pelanggan.",steps:["**Layanan Andalan Kami:** menampilkan artikel 3 layanan andalan, yaitu Green Energy, Smart Connectivity Solutions, dan Digital Solution.", "**Koneksi Internet Bebas Hambatan:** menampilkan rekomendasi bandwidth di lokasi yang terpasang. Non pelanggan melihat bandwidth yang tersedia di wilayah tersebut. Pelanggan melihat paket di atas bandwidth terpasang (contoh: pelanggan 35 Mbps melihat 50 Mbps dan 100 Mbps). Jika diklik, muncul detail layanan dan jumlah pengguna. **CSO tidak aktif menginformasikan hal ini kepada pelanggan atau non pelanggan.**", "**Promo ICONNET:** menampilkan program promosi yang sedang berlaku.", "**Cek Coverage:** lihat kasus Cek coverage di aplikasi.", "**Berita:** menampilkan berita seputar promo dan kegiatan ICONNET di seluruh regional."]},
  {id:"coverage",n:"Cek coverage di aplikasi",ciri:"Calon pelanggan ingin memeriksa coverage jaringan ICONNET melalui aplikasi.",steps:["Pilih menu **Beranda**.", "Pilih menu **Cek Coverage**.", "Klik **Cari lokasi**, input alamat lokasi, lalu pastikan titik sudah sesuai.", "Klik **Check Coverage**.", "Akan muncul notifikasi **Area Tercover** atau **Area Tidak Tercover**."]},
  {id:"iconnet",n:"Menu Iconnet: informasi yang tampil",ciri:"Pelanggan menanyakan perbedaan tampilan menu Iconnet antara non pelanggan (terdapat history pengajuan) dan pelanggan.",steps:["**Non pelanggan (terdapat history pengajuan):** tampil saldo deposit, tombol VoIP (terhubung dengan call center), dan ikon lonceng untuk menerima notifikasi. ID Pelanggan tidak tampil.", "**Pelanggan:** tampil ID Pelanggan ICONNET, saldo deposit, tombol VoIP dan ikon lonceng, serta jumlah layanan yang digunakan dan detail informasi bandwidth, periode pemakaian, status layanan, nominal tagihan, jatuh tempo, status pembayaran, dan tanggal bayar."]},
  {id:"voip",n:"Fitur VoIP (call center)",ciri:"Pelanggan ingin menghubungi CSO melalui fitur VoIP di aplikasi.",steps:["**Non pelanggan (terdapat history pengajuan):** VoIP bisa digunakan jika calon pelanggan ingin terhubung dengan CSO Inbound. Pada device tidak tertera ID Pelanggan ICONNET.", "**Pelanggan:** VoIP bisa digunakan jika pelanggan ingin terhubung dengan CSO Inbound. Pada device tertera ID Pelanggan ICONNET."]},
  {id:"upgrade",n:"Upgrade layanan melalui aplikasi",ciri:"Pelanggan menanyakan fitur Upgrade Layanan di aplikasi.",steps:["Aplikasi menampilkan rekomendasi bandwidth ICONNET yang tersedia.", "**Non pelanggan (terdapat history pengajuan):** muncul semua bandwidth ICONNET yang tersedia, namun tidak bisa diajukan.", "**Pelanggan:** muncul paket di atas bandwidth terpasang. Jika diklik, muncul detail layanan dan jumlah pengguna.", "Pelanggan mengajukan upgrade langsung dengan klik **Upgrade Sekarang**, lalu **Ya, Lanjutkan**.", "Pelanggan dialihkan ke halaman pembayaran yang memuat batas waktu pembayaran, total yang harus dibayar, dan metode pembayaran.", "Setelah memilih satu metode pembayaran, muncul kode VA dan detail tata cara pembayaran.", "**CSO tidak aktif menginformasikan batas minimal dan maksimal jumlah device kepada pelanggan.**"]},
  {id:"nomorbayar",n:"Nomor pembayaran",ciri:"Pelanggan atau non pelanggan menanyakan cara melihat nomor pembayaran (kode VA) tagihan di aplikasi.",steps:["Pilih menu **Iconnet**.", "Pilih dan klik metode pembayaran yang tersedia.", "Akan muncul total tagihan (sudah termasuk biaya admin) dan tata cara pembayaran.", "Non pelanggan (terdapat history pengajuan) hanya bisa melihat nomor pembayaran jika kode VA berlangganan sudah terbit.", "Untuk pelanggan, aplikasi memudahkan melihat nomor pembayaran tagihan bulanan."]},
  {id:"laporan",n:"Buat laporan gangguan atau keluhan",ciri:"Pelanggan ingin melaporkan gangguan atau keluhan secara mandiri melalui aplikasi.",steps:["Non pelanggan **tidak bisa** membuat laporan di aplikasi.", "Pelanggan: pilih menu **Iconnet**.", "Pilih **Menu Pintas**, lalu **Buat Laporan**. Muncul formulir Buat Laporan.", "Pilih kategori: Gangguan atau Keluhan.", "Pilih permasalahan yang dialami.", "Input informasi tambahan dan detail kendala pada **Detail Laporan**.", "Klik ikon **Berkas Laporan** untuk menambahkan gambar.", "Klik **Kirim Laporan**."]},
  {id:"faq",n:"FAQ dan Pusat Bantuan",ciri:"Pelanggan atau calon pelanggan ingin mencari jawaban sendiri atas permasalahan.",steps:["**FAQ (Menu Pintas di Iconnet):** menampilkan contoh permasalahan yang sering terjadi untuk memudahkan penyelesaian permasalahan.", "**Pusat Bantuan (menu Profil):** menampilkan banyak contoh permasalahan yang sering terjadi, dengan kategori FAQ: Internet, Layanan, Pendaftaran, Gangguan, Tagihan, dan Lain-lain."]},
  {id:"refund",n:"Refund melalui aplikasi",ciri:"Pelanggan atau non pelanggan ingin mengajukan pengembalian dana secara mandiri. Non pelanggan: karena batal aktivasi. Pelanggan: karena salah nominal bayar.",steps:["Install aplikasi MyICON+, lalu buka dan klik **Masuk dengan Google**.", "Input email yang ingin digunakan untuk login.", "Pilih menu **Iconnet**.", "Pada **Menu Pintas**, klik **Refund**.", "Pada halaman ini akan tertera saldo refund, kemudian klik **Tarik Saldo**.", "Masukkan nominal dan nomor rekening serta bank yang digunakan dengan benar.", "Baca dan centang Syarat & Ketentuan, kemudian klik **Tarik Saldo**.", "Pada halaman konfirmasi, pastikan data telah sesuai, kemudian klik **Ya, Lanjutkan**.", "Pengajuan refund berhasil. Klik **Ok**, proses pengajuan bisa dilihat pada Riwayat Transaksi."]},
  {id:"addon",n:"Add On: Wifi Extender, OTT, Smart Home",ciri:"Pelanggan menanyakan layanan add on yang tampil di menu Iconnet.",steps:["Menu Iconnet menampilkan detail informasi add on berupa nama layanan, harga layanan, serta syarat dan ketentuan atau kelebihan produk.", "**Wifi Extender:** produk yang tersedia Premium, Medium, dan Basic.", "**OTT (ICONPLAY):** produk yang tersedia ICONPLAY Sport, Premium, dan Basic. Pendaftaran ICONPLAY saat ini berstatus hold / pending (lihat kartu ICONPLAY).", "**Smart Home:** produk yang muncul Avaro Smart Indoor IP CCTV dan Avaro Smart Outdoor IP CCTV.", "Untuk harga dan ketentuan produk, lihat kartu Add On."]},
  {id:"chat",n:"Chat Kami (live chat)",ciri:"Pelanggan ingin terhubung dengan CSO live chat melalui aplikasi.",steps:["Pilih menu **Iconnet**.", "Pilih ikon **Chat Kami**.", "Pelanggan dialihkan ke tampilan live chat.", "Klik menu **Beranda**, lalu klik menu **Chat Agent**.", "Klik **Ya, hubungkan dengan Agent** jika ingin terhubung dengan CSO live chat.", "Pelanggan menunggu respon dari CSO live chat."]},
  {id:"riwayat",n:"Menu Riwayat (Aktivitas dan Tagihan)",ciri:"Pelanggan menanyakan isi menu Riwayat.",steps:["**Aktivitas, non pelanggan (terdapat history pengajuan):** menampilkan riwayat aktivitas pengajuan, misalnya pengajuan berlangganan ICONNET baik yang sudah atau belum terbit VA.", "**Aktivitas, pelanggan:** menampilkan riwayat aktivitas pengajuan dan pengaduan pelanggan, misalnya pengajuan upgrade dan laporan gangguan dan keluhan.", "**Tagihan, non pelanggan:** jika saat pengajuan berlangganan tidak bisa diproses lebih lanjut sebelum VA terbit, akan tampil \"Data tidak ditemukan\".", "**Tagihan, pelanggan:** menampilkan listing riwayat tagihan. Jika salah satu tagihan diklik, muncul detail transaksi: layanan, identitas pelanggan, periode pemakaian, tanggal pembayaran, status pembayaran, dan rincian tagihan."]},
  {id:"profil",n:"Menu Profil",ciri:"Pelanggan menanyakan isi menu Profil.",steps:["**Informasi Pengguna:** menampilkan nama pengguna dan email yang digunakan saat login. Untuk pelanggan, tampil juga ID Pelanggan ICONNET.", "**Informasi Berlangganan (pelanggan):** menampilkan profil pelanggan sesuai data saat pengajuan berlangganan, serta metode pembayaran dan kode bayar yang bisa digunakan.", "**Informasi Akun Terhubung:** lihat kasus Akun terhubung dan memutus akun.", "**Hubungi Kami:** hanya menampilkan informasi kanal layanan ICONNET: website, WhatsApp, email, telepon, dan Instagram. Pelanggan Enterprise merupakan call center untuk pelanggan corporate. Logo Facebook, X, dan YouTube jika diklik terhubung dengan PT PLN Icon Plus. Logo Instagram jika diklik terhubung dengan Instagram iconnet.care, bukan iconnet.here.", "**Syarat dan Ketentuan:** hanya menampilkan Pasal 1 hingga 14 perihal informasi syarat dan ketentuan berlangganan ICONNET.", "**Kebijakan Privasi:** hanya menampilkan informasi perihal kebijakan privasi: Data Pengguna, Pengguna Informasi, Perubahan, dan File Log.", "**Tentang Aplikasi:** menampilkan informasi dan versi aplikasi MyICON+ yang terinstall di device.", "**Keluar:** keluar dari aplikasi, sehingga harus login kembali menggunakan akun Google."]},
 ]},

mg:{meta:'Kendala aplikasi MyICON+: probing dan tiket ke IT Enterprise',pillLabel:'Jenis kendala',fold:true,
 note:'Semua tiket kendala aplikasi MyICON+ dikirim ke **IT Enterprise**. Pastikan probing lengkap sebelum membuat tiket.',
 sections:[

   tiket:[["MyICON+ Kendala Menghubungkan Akun",'IT Enterprise']],dl:['Deskripsi'],d:['Pelanggan mengalami kendala pada aplikasi MyICON+ (kendala menghubungkan akun).\n\nDetail kendala: xxxxxx\nMenu atau fitur yang bermasalah: xxxxxx\nPesan error: xxxxxx\nPerangkat: xxxxxx (Android atau iOS)\nVersi aplikasi MyICON+: xxxxxx\nScreenshot kendala: terlampir\n\nNomor alternatif: 08xxxxxx. Mohon dibantu pengecekan dan tindak lanjutnya. Terima kasih.']},
  {id:"rating",n:"Tidak bisa rating pada live chat",ciri:"Pelanggan tidak bisa memberikan rating setelah sesi live chat di aplikasi.",steps:["Lengkapi probing pada bagian di atas.", "Buat tiket di bawah."],
   tiket:[["MyICON+ Kendala Rating (Tidak Bisa Rating pada Live Chat)",'IT Enterprise']],dl:['Deskripsi'],d:['Pelanggan mengalami kendala pada aplikasi MyICON+ (kendala rating live chat).\n\nDetail kendala: xxxxxx\nMenu atau fitur yang bermasalah: xxxxxx\nPesan error: xxxxxx\nPerangkat: xxxxxx (Android atau iOS)\nVersi aplikasi MyICON+: xxxxxx\nScreenshot kendala: terlampir\n\nNomor alternatif: 08xxxxxx. Mohon dibantu pengecekan dan tindak lanjutnya. Terima kasih.']},
