.ico{--c:#7b8794;flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:color-mix(in srgb,var(--c) var(--ct-pct),var(--ct-mix));background:color-mix(in srgb,var(--c) 15%,transparent);transition:transform .18s ease,background .18s ease}

.c-red{--c:#e06c6c}.c-amber{--c:#d9a043}.c-violet{--c:#a07ae0}.c-blue{--c:#5b94e6}.c-cyan{--c:#4fb7c9}.c-green{--c:#5bb98f}.c-slate{--c:#7b8794}

@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* stamp governance */
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut)}
.stamp b{color:var(--tx);font-weight:600}
.stamp.ok{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.stamp.ok b{color:inherit}
.stamp.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.stamp.warn b{color:inherit}
.stamp .ic{width:14px;height:14px}
.stamps .btn{padding:4px 10px;font-size:12px;min-height:0}
/* micro-interaksi */
.toast{display:flex;align-items:center;gap:9px;animation:tin .18s ease-out}
.toast .ti{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;background:color-mix(in srgb,var(--bg) 22%,transparent);flex:none}
.toast.ok .ti{background:var(--acc);color:var(--accfilltx)}
.toast.warn .ti{background:var(--warn);color:#fff}
.toast.err .ti{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mut);white-space:nowrap;transition:color .2s,border-color .2s,background .2s,box-shadow .35s}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mut);transition:background .2s}
.live.ok{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent),0 0 14px color-mix(in srgb,var(--acc) 45%,transparent)}
.live.ok i{background:var(--acc)}
.live.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent),0 0 14px color-mix(in srgb,var(--warn) 45%,transparent)}
.live.warn i{background:var(--warn)}
.copied{outline:2px solid var(--acc);outline-offset:2px}
.copied::after{content:" ✔";font-weight:700}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.live{transition:none}}
@media(max-width:560px){.live span{display:none}.live{padding:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.dome{background:radial-gradient(circle at 38% 32%,rgba(0,0,0,0) 38%,rgba(60,45,100,.10) 68%,rgba(35,25,70,.42) 100%),radial-gradient(ellipse 58% 26% at 60% 93%,rgba(255,255,255,.38),rgba(255,255,255,0) 75%)}
:root[data-theme=dark] .dome{background:radial-gradient(circle at 38% 32%,rgba(0,0,0,0) 34%,rgba(0,0,10,.35) 64%,rgba(0,0,8,.82) 100%),radial-gradient(ellipse 58% 26% at 60% 93%,rgba(120,230,255,.30),rgba(255,255,255,0) 75%)}
.gls{left:15%;top:9%;width:34%;height:24%;background:radial-gradient(ellipse at 40% 45%,rgba(255,255,255,.95),rgba(255,255,255,.5) 55%,rgba(255,255,255,0) 100%);box-shadow:none;transform:rotate(-38deg) translate(calc(var(--mx)*1px),calc(var(--my)*.8px));filter:blur(.4px)}
.gls::after{content:"";position:absolute;left:30%;top:28%;width:22%;height:30%;border-radius:50%;background:#fff;filter:blur(.3px)}
:root[data-theme=dark] .gls{background:radial-gradient(ellipse at 40% 45%,rgba(255,255,255,.9),rgba(255,255,255,.3) 55%,rgba(255,255,255,0) 100%)}
.sw{background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%)}

.dome{background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.18) 0,rgba(0,0,0,0) 30%),radial-gradient(circle at 40% 34%,rgba(0,0,0,0) 30%,rgba(70,50,120,.16) 58%,rgba(40,25,85,.62) 100%),radial-gradient(ellipse 58% 24% at 58% 94%,rgba(255,255,255,.5),rgba(255,255,255,0) 75%)}
:root[data-theme=dark] .dome{background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.14) 0,rgba(0,0,0,0) 30%),radial-gradient(circle at 40% 34%,rgba(0,0,0,0) 26%,rgba(0,0,10,.5) 56%,rgba(0,0,6,.92) 100%),radial-gradient(ellipse 58% 24% at 58% 94%,rgba(120,230,255,.4),rgba(255,255,255,0) 75%)}
.gls{left:14%;top:8%;width:40%;height:26%;background:radial-gradient(ellipse at 42% 48%,#fff 0,rgba(255,255,255,.75) 40%,rgba(255,255,255,0) 100%);transform:rotate(-40deg)}
.gls::after{left:28%;top:30%;width:26%;height:34%;box-shadow:0 0 3px #fff}

.spk{display:none!important}
.gls::after{display:none}
.tex{inset:-90%!important}
.tex.t2{inset:-110%!important}

.orb{width:30px;height:40px}
.gsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
:root[data-theme=dark] .gsvg .l,:root[data-theme=light] .gsvg .d{display:none}
.gls{left:18%;top:8%;width:36%;height:22%}

.orb{width:34px;height:44px}
.gcv{position:absolute;inset:0;width:100%;height:100%;display:none;border-radius:50%}
#orb.gl-on .gcv{display:block}
#orb.gl-on .gsvg{visibility:hidden}
#orb.gl-on .dome,#orb.gl-on .gls,#orb.gl-on .sw{display:none}
#orb.gl-on .stone{box-shadow:none}

/* === opal foto === */
.stone{box-shadow:inset 0 0 0 .6px rgba(0,0,0,.18)}
.oi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none;user-select:none;-webkit-user-drag:none;transform:scale(1.04) translate(calc(var(--mx)*-.6px),calc(var(--my)*-.6px));transition:transform .25s ease-out}
:root[data-theme=dark] .ol,:root[data-theme=light] .od{display:none}
.sw{background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.0) 42%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 58%,transparent 64%);mix-blend-mode:soft-light;opacity:0;transform:translateX(-130%);display:block!important}
:root[data-theme=dark] .sw{mix-blend-mode:screen}
@keyframes glint{0%{transform:translateX(-130%);opacity:1}100%{transform:translateX(130%);opacity:1}}
@media(prefers-reduced-motion:no-preference){.sw{animation:none!important}button.orb:hover .sw{animation:glint .85s ease-out!important}.gem.flip .sw{animation:glint .9s .2s ease-out!important}}

.gcv{position:absolute;inset:0;width:100%;height:100%;display:none;border-radius:50%;pointer-events:none}
#orb.gl-on .gcv{display:block}
#orb.gl-on .oi{visibility:hidden}
.lab .chip{padding:5px 16px;min-height:0;font-size:12px;line-height:1.4;border-radius:999px;white-space:nowrap;flex:none}
div.txt .ln{padding:1px 0}div.txt .gap{height:8px}
div.txt .li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
div.txt .li:first-child{padding-top:0}div.txt .li:last-child{border-bottom:0;padding-bottom:0}
div.txt .li .n{flex:none;min-width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
div.txt .li .b{flex:none;width:24px;text-align:center;color:var(--acc);font-weight:700}
div.txt .li>span:last-child{flex:1;min-width:0}
div.txt .kv{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 80%,transparent)}
div.txt .kv:last-child{border-bottom:0}
.tkp{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin:14px 0;padding:14px 18px;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-left:5px solid var(--acc);border-radius:12px;background:color-mix(in srgb,var(--acc) 8%,var(--panel))}
.tkp .l{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.tkp .tkm{flex:1 1 260px;min-width:0}
.tkp .v{font-size:17px;font-weight:800;color:var(--tx);line-height:1.35}
.tkp .tkb{display:inline-block;font-size:15px;font-weight:800;padding:6px 16px;border-radius:999px;color:#fff;background:var(--bad);letter-spacing:.02em}
.tkp .tkb.ok{background:var(--acc)}
.steps b{font-weight:700;color:var(--tx)}
.lab span{color:var(--tx);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tpl div.txt{border-left:4px solid color-mix(in srgb,var(--acc) 60%,transparent)}
div.txt mark.ph{background:color-mix(in srgb,var(--warn) 38%,transparent);font-weight:700;border-radius:4px;padding:0 3px;color:inherit}
.tpl div.txt .ln,.tpl div.txt .kv b{font-weight:500}
.tpl div.txt .kv span{color:var(--tx);font-weight:500}
div.txt .kv b{flex:none;font-weight:600;color:var(--tx)}div.txt .kv span{color:var(--mut);flex:1;min-width:0}
</style>

function trCli(txt){
  if(!/receive power|optical/i.test(txt))return null;
  const m=txt.match(/(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]+(-?\d+(?:\.\d+)?)[ \t]*$/m);
  if(!m)return null;
  const [rx,hA,hW,lW,lA]=m.slice(1).map(Number);
  if(!(hA>=hW&&hW>=lW&&lW>=lA))return null;
  const ok=rx<=hW&&rx>=lW;
  return{id:'sig',n:'Level sinyal (CLI)',slot:'result',t:ok?'kualitas sinyal pada jalur penghubung perangkat berada dalam batas normal':'kualitas sinyal pada jalur penghubung perangkat menurun'};
}
const TR_SKIPLN=/^\W*\d+\.\s|#|optical|threshold|line protocol|description|\d{3,}|\d+\/\d+|^\W*(tanggal|kategori|teknologi|desain|pop \d|analisa|cek redaman|alokasi|estimasi|laporan \/|rootcause|action|persiapan|perjalanan|perizinan|investigasi|material|recovery|resume|hasil invest|summary|update progress|perapihan|data core|penyebab|koordinat)|\b(senin|selasa|rabu|kamis|jumat|sabtu|minggu),|-?\d{1,3}[.,]\d{4,}|https?:|dbm|packet|ping/;
function trUnknown(txt){
  const out=[];
  txt.split(/\n/).forEach(l=>{
    const ln=l.trim().toLowerCase().replace(/[–—]/g,'-');
    if(ln.length<12||(ln.match(/[a-z]/g)||[]).length<8||TR_SKIPLN.test(ln))return;
    if(TR_RULES.some(r=>r.re[0].test(ln))||TR_INTERNAL.test(ln))return;
    const k=ln.replace(/\s+/g,' ').slice(0,120);
    if(!out.includes(k))out.push(k);
  });
  return out.slice(0,8);
}
const trCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function trTranslate(raw){
  const txt=String(raw||'');
  const N=txt.toLowerCase().replace(/[–—]/g,'-').replace(/\s*\n\s*/g,' | ').replace(/[ \t_]+/g,' ').trim();
  if(!N)return{text:'',unk:[],hit:[],state:'empty'};
  let M=TR_RULES.filter(r=>r.re.every(x=>x.test(N))&&!(r.not||[]).some(x=>x.test(N)));
  const cli=trCli(txt);if(cli)M.push(cli);
  const sup=new Set();M.forEach(r=>(r.sup||[]).forEach(i=>sup.add(i)));
  M=M.filter(r=>!sup.has(r.id));
  const ids=new Set(M.map(r=>r.id));
  M=M.filter(r=>!(r.skip||[]).some(i=>ids.has(i)));
  const unk=trUnknown(txt);
  if(!M.length){
    if(TR_INTERNAL.test(N))return{text:'',unk:[],hit:[],state:'internal'};
    return{text:TR_GENERIC,unk,hit:[],state:'unknown'};
  }
  const has=i=>M.some(r=>r.id===i);
  const by=s=>M.filter(r=>r.slot===s).map(r=>r.t);
  const prep=by('prep'),found=by('found'),cause=by('cause'),act=by('action'),res=by('result'),ind=by('ind');
  const S=[];
  if(!prep.length&&!found.length&&!cause.length&&!act.length&&!res.length){
    ind.forEach(t=>S.push(trCap(t)+'.'));S.push('Tim sedang memeriksa dan kami akan menginformasikan perkembangannya.');
  }else{
    prep.forEach(t=>S.push(trCap(t)+'.'));
    const pre=prep.length&&found.length?'Hasil pengecekan: ':'';
    if(found.length){
      found.forEach(t=>S.push(pre?pre+t+'.':trCap(t)+'.'));
    }
    cause.forEach(t=>S.push(trCap(t)+'.'));
    act.forEach(t=>S.push(trCap(t)+'.'));
    res.forEach(t=>S.push(trCap(t)+'.'));
    const done=has('splice')||has('normalkan')||has('kwh-normal');
    if(has('konfirmasi'))S.push('Jika masih ada kendala, mohon kabari kami.');
    else if(!res.length&&done)S.push('Silakan dicek kembali layanannya, dan kabari kami jika masih terkendala.');
    else if(!res.length)S.push(TR_WAIT);
  }
  return{text:S.join(' '),unk,hit:M.map(r=>r.n),state:'ok'};
}
const TR_TIME=/\b(jam|menit|detik|hari|pukul|wib|wita|wit|segera|sebentar lagi|estimasi|target|maksimal|besok|nanti malam)\b/i;
function trGuardMsg(v){
  const w=[];
  if(/\d/.test(v))w.push('angka');
  if(TR_TIME.test(v))w.push('kata waktu atau janji (jam, hari, segera, estimasi)');
  return w.length?'Hapus '+w.join(' dan ')+' sebelum disalin: pelanggan hanya perlu kejelasan dan penanganan cepat, bukan detail yang bisa meleset.':'';
}
function trGuard(v){const el=$('#trWarn');if(!el)return;const m=trGuardMsg(v);el.textContent=m;el.hidden=!m;S.tr.out=v}
function trPaint(r,setOut){
  if(setOut){const o=$('#trOut');if(o)o.value=r.text;trGuard(r.text)}
  const st=$('#trState');
  if(st){
    st.innerHTML=r.state==='internal'?'<span class="badge warn">Laporan internal NOC</span> <span class="hint">Berisi alert perangkat tanpa temuan lapangan. Tidak perlu disampaikan ke pelanggan.</span>'
      :r.state==='unknown'?'<span class="badge warn">Belum dikenali</span> <span class="hint">Tidak ada istilah yang cocok, jadi ditampilkan kalimat ringkas.</span>'
      :r.state==='ok'?'<span class="hint">Istilah dikenali:</span> '+[...new Set(r.hit)].map(h=>`<span class="badge mut">${esc(h)}</span>`).join(' ')
      :'';
  }
  const u=$('#trUnk');
  if(u){u.hidden=!r.unk.length;u.querySelector('b').textContent=r.unk.length}
}
function trRun(v){S.tr.inp=v;const r=trTranslate(v);S.tr.out=r.text;S.tr.unk=r.unk;trPaint(r,true)}
function trInit(){const r=trTranslate(S.tr.inp);S.tr.unk=r.unk;trPaint(r,false);trGuard(S.tr.out)}

function toastKind(m){return /^(gagal|file tidak|tanggal tidak|lengkapi|minimal|suara tidak|browser ini)/i.test(m)?'err':/tersalin|berhasil|disimpan|diajukan|diterbitkan|diverifikasi|masuk sebagai|peran aktif/i.test(m)?'ok':'info'}
function toast(m,kind){
  const t=$('#toast');kind=kind||toastKind(m);
  t.className='toast '+kind;t.textContent='';
  const i=document.createElement('span');i.className='ti';i.setAttribute('aria-hidden','true');i.textContent=kind==='ok'?'✔':kind==='err'?'!':'i';
  const x=document.createElement('span');x.textContent=m;t.append(i,x);
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,kind==='err'?4200:2600);
  if(kind==='ok'){
    if(lastBtn&&lastBtn.isConnected&&/copy/.test(lastBtn.dataset.a||'')){const b=lastBtn;b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),1300)}
    if(/tersalin/i.test(m))pulse('Tersalin','ok');
  }else if(kind==='err')pulse('Perlu dicek','warn');
}
function pulse(txt,kind){
  const l=document.getElementById('live');if(!l)return;
  l.className='live '+(kind||'ok');l.querySelector('span').textContent=txt;
  clearTimeout(liveT);liveT=setTimeout(()=>{l.className='live';l.querySelector('span').textContent='Siap'},1800);
}

function syncSearch(){const has=!!$('#q').value;$('#searchBox').classList.toggle('has',has);$('#btnClear').hidden=!has}
function search(q){
  const n=norm(q);if(!n)return[];
  const toks=n.split(' ').filter(t=>t.length>1);
  return cards().filter(c=>c.status!=='usang').map(c=>{
    let s=0;const hits=[];
    for(const k of c.keywords||[]){
      const nk=norm(k);if(!nk)continue;
      if(n.includes(nk)){s+=10+nk.length;hits.push(k)}
      else{const ov=nk.split(' ').filter(t=>t.length>2&&toks.includes(t)).length;if(ov){s+=ov*3;hits.push(k)}}
    }
    if(norm(c.title).includes(n))s+=8;
    if(s>0)s+=(c.priority||0);
    return{c,s,hits};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
}
function showResults(commit){
  const q=$('#q').value.trim(),box=$('#results');
  if(!q){box.hidden=true;S.results=[];return}
  S.results=search(q);
  if(S.hit>=S.results.length)S.hit=0;
  if(!S.results.length){
    box.innerHTML='<div class="none">Tidak ada kartu yang cocok. Hubungi TL On-Duty atau buka <b>Gangguan — Lain-lain</b>.</div>';
    box.hidden=false;
    if(commit){DB.unmatched[norm(q)]=(DB.unmatched[norm(q)]||0)+1;save();logAct('cari-tanpa-hasil',q)}
    return;
  }
  box.innerHTML=S.results.map((r,i)=>`<button data-a="open" data-id="${esc(r.c.id)}" class="${i===S.hit?'on':''}">${icoTile(r.c)}<span><b>${esc(GROUPS[r.c.group]||'')} — ${esc(r.c.title)}</b><br><small class="hint">cocok: ${esc(r.hits.slice(0,3).join(', '))}</small></span></button>`).join('');
  box.hidden=false;
}

function knSim(ch,iso){

  const skipped=[];
  const at=n=>{let x=new Date(pay);let k=0;while(k<n){x=add(x);if(kal||!knOff(x))k++;else skipped.push(new Date(x))}return x};

  const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());

const KD_TB=[["Lunas", "Tidak ada", "Belum flagging lunas", "Billing Ritel Pusat"], ["Belum flagging lunas", "Ada", "Belum flagging lunas", "Billing Ritel Pusat"], ["Lunas", "Ada", "Belum flagging lunas", "Billing Ritel Pusat"], ["Belum flagging lunas", "Tidak ada", "Belum flagging lunas", "Helpdesk PLN Mobile"]];
function viewKendala(c){
  const g=GROUPS[c.group]||'';
  let k=KD.find(x=>x.id===S.kd.c)||KD[0];S.kd.c=k.id;
  S.kd.t=[];
  const cp=(label,text)=>{const i=S.kd.t.push(text)-1;return `<div class="lab"><span>${esc(label)}</span><button class="btn pri chip" data-a="kdcopy" data-i="${i}" aria-label="Salin ${esc(label)}" title="Salin ${esc(label)}">Salin</button></div><div class="txt" style="white-space:pre-line">${fillHTML(text)}</div>`};
  const ol=a=>'<ol class="steps">'+a.map(t=>'<li>'+hlStep(t)+'</li>').join('')+'</ol>';
  const pills=KD.map(x=>`<button class="pill ${x.id===k.id?'on':''}" data-a="kdcase" data-v="${x.id}" aria-pressed="${x.id===k.id}">${esc(x.n)}</button>`).join('');
  const tbl='<table><thead><tr><th>ICONPAY: detail pembayaran</th><th>ICONPAY: mutasi dana</th><th>ICRM+: status billing</th><th>Tiket Keluhan — Billing ke</th></tr></thead><tbody>'+KD_TB.map(r=>'<tr>'+r.map((x,i)=>'<td>'+(i===3?'<b>'+esc(x)+'</b>':esc(x))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  let body='';
  if(k.hasil){
    const hk=S.kd.r==='gagal'?'gagal':'ok',h=k.hasil[hk];
    const hp=Object.entries(k.hasil).map(([id,x])=>`<button class="pill ${id===hk?'on':''}" data-a="kdres" data-v="${id}" aria-pressed="${id===hk}">${esc(x.n)}</button>`).join('');
    body=`<div class="box"><h3>${esc(k.n)}</h3><div class="q" style="margin:0 0 12px"><b>Kondisi</b><div style="margin-top:4px">${esc(k.ciri)}</div></div><div class="subt">Langkah CSO</div>${ol(k.steps)}</div>
    <div class="box gr"><div class="q" style="margin:0 0 12px"><b>Hasil open isolir</b><div class="pills">${hp}</div></div>
    ${h.tiket.map(t=>tkHTML(tk(t.k,t.t,t.m))).join('')}
    ${h.d.map((t,i)=>cp(h.d.length>1?'Deskripsi '+(i+1):'Deskripsi',t)).join('')}</div>`;
  }else{
    body=`<div class="box"><h3>${esc(k.n)}</h3><div class="q" style="margin:0 0 12px"><b>Kondisi</b><div style="margin-top:4px">${esc(k.ciri)}</div></div><div class="subt">Langkah CSO</div>${ol(k.steps)}</div>
    <div class="box gr">${k.tiket.map(t=>tkHTML(tk(t.k,t.t))).join('')}${cp('Deskripsi 1',k.d1)}${cp('Deskripsi 2',k.d2)}</div>`;
  }
  return `<div class="head"><div><div class="titlerow">${icoTile(c,'lg')}<h1>${esc(g)} — ${esc(c.title)}</h1></div>
    <div class="meta">Tindak lanjut kendala pembayaran pelanggan</div></div></div>
  <div class="box"><div class="q" style="margin:0"><b>Pilih kendala pelanggan</b><div class="pills">${pills}</div></div></div>
  ${body}
  <details class="box"><summary><b>Cara membaca ICONPAY dan ICRM+</b></summary><div style="margin-top:10px">${tbl}
    <ol class="steps" style="margin-top:12px"><li>Pastikan sudah ada bukti transaksi pembayaran.</li><li>Tidak ada dana reversal (dana kembali), dilihat dari mutasi dana.</li><li>CSO dapat menindaklanjuti apabila sudah melebihi SLA settlement.</li></ol></div></details>`;
}

 sections:[
  {h:'Syarat dan ketentuan',ol:[
   {t:'**Pelanggan prepaid yang sudah memiliki tagihan terbit:** periksa periode penggunaan pada tagihan tersebut.',sub:[
    '**Pengajuan masih di dalam periode penggunaan:** upgrade dapat diajukan. CSO tetap mengedukasi pelanggan untuk membayar tagihan yang sudah terbit.',

   '**Pelanggan postpaid yang masih memiliki tagihan lama:** pelanggan **wajib** membayar tagihan terlebih dahulu. Upgrade diproses setelah tagihan lunas.',

   '**Saluran pengajuan:** contact center, sales, atau mandiri melalui aplikasi MyICON+.',
   '**Paket HEBAT tidak dapat upgrade.** Ketentuan yang sama berlaku bagi pelanggan promo Winback ("Tak Bisa ke Lain Hati") dan program COBA ICONNET. Apabila pelanggan Winback atau COBA ICONNET tetap ingin upgrade atau downgrade, CSO harus proaktif menginformasikan bahwa **promo akan hangus atau harga kembali normal**.',

  {h:'Biaya upgrade berdasarkan harga paket',ol:[

   d:['Kami menerima laporan pelanggan ingin mengajukan upgrade. CSO mengedukasi pembayaran terlebih dahulu karena terdapat tagihan aktif yang belum dibayarkan.']}]},

dwn:{meta:'Menurunkan kecepatan layanan internet',
 note:'**Contact center wajib melakukan retensi** apabila pelanggan mengajukan downgrade.',
 sections:[
  {h:'Langkah awal: tanyakan alasan dan lakukan retensi',open:'Boleh kami mengetahui alasan pengajuan downgrade layanan ini? Kami sangat menyayangkan apabila downgrade diajukan.',table:{cols:['Alasan pelanggan','Tindakan CSO'],rows:[
   ['**Tekanan finansial atau sensitif harga**','Uraikan selisih harga per hari antara paket saat ini dan paket di bawahnya. Selisih bulanan terlihat besar, tetapi per hari hanya sekitar Rp1.000 sampai Rp2.000, sangat kecil dibanding risiko turunnya kenyamanan. Sampaikan juga bahwa promo aktif akan hilang, dan harga permanen saat ini bisa hilang jika kelak pelanggan ingin upgrade kembali.'],
   ['**Kapasitas dianggap berlebih**','Tanyakan jumlah perangkat yang terhubung setiap hari. Jelaskan bahwa jika kecepatan diturunkan dan semua perangkat dipakai bersamaan, kecepatan terbagi sehingga internet terasa lebih lambat.'],
   ['**Internet lambat, tidak stabil, sering putus atau lagging**','Tanyakan jumlah perangkat yang terhubung setiap hari. Jelaskan dampak penurunan kecepatan seperti di atas. **Tawarkan perbaikan terlebih dahulu:** buat tiket gangguan Internet Slow atau Intermittent ke NOC Ritel Pusat sesuai narasi pelanggan.']]},
   go:[['gg-internet-slow','Buka Internet Slow'],['gg-intermittent','Buka Intermittent']]},
  {h:'Syarat dan ketentuan',ol:[
   '**Sudah terbit tagihan:** CSO mengedukasi pelanggan untuk membayar terlebih dahulu, baik prepaid maupun postpaid.',
   '**Billing postpaid berubah menjadi prepaid** apabila downgrade dilakukan.',
   '**Pengajuan lewat telepon atau inbound:** arahkan ke layanan digital, karena membutuhkan lampiran KTP.',
   '**Paket HEBAT tidak dapat downgrade.** Ketentuan yang sama berlaku bagi pelanggan promo Winback ("Tak Bisa ke Lain Hati") dan program COBA ICONNET. Apabila pelanggan tetap ingin upgrade atau downgrade, CSO harus proaktif menginformasikan bahwa **promo akan hangus atau harga kembali normal**.',
   '**Jadwal konfigurasi:** dilakukan pada **tanggal 24**, baik prepaid maupun postpaid. Tagihan bandwidth baru terbit pada **tanggal 25** sesuai ketentuan fixed date billing prepaid.',
   '**Kode pembayaran tidak memiliki masa kedaluwarsa.**',
   '**Tidak ada perhitungan pro rata** untuk downgrade.']},
  {h:'Data yang ditanyakan kepada pelanggan',data:['Nama','ID Pelanggan','Email','Bandwidth lama','Bandwidth baru','Lampiran foto KTP asli pelanggan terdaftar'],note:'Jika data sesuai, lakukan AKAD.'}],
 internal:{h:'Urutan proses downgrade (internal)',ol:[
  'CSO membuka tiket Keluhan — Permohonan Downgrade ke Sales.',
  'Tim Sales mengajukan di ICRM+ hingga muncul ID Permohonan.',
  'Manager Penjualan dan Aktivasi Ritel menganalisis dan menyetujui pengajuan.',
  'Jika disetujui, dilakukan konfigurasi jaringan sesuai ketentuan berlaku.',
  {t:'Jika tidak disetujui:',sub:['pelanggan tetap menerima email notifikasi;','pelanggan prepaid tetap memakai layanan lama dan menerima tagihan sesuai periodenya;','pelanggan postpaid tidak dialihkan menjadi prepaid.']},
  'Sebelum manager menyetujui, pelanggan masih dapat membatalkan pengajuan melalui SBU atau contact center.',
  'Progres dapat dicek di sub menu **Mutasi** pada ICRM+.']},
 cases:[
  {id:'ajukan',n:'Tetap downgrade setelah retensi',ciri:'Retensi sudah dilakukan, data sesuai, dan AKAD sudah dilakukan.',tiket:[['Keluhan — Permohonan Downgrade','Sales Ritel SBU']],
   d:['Kami menerima laporan pelanggan ingin mengajukan permohonan downgrade.','Mohon dibantu pengajuan permohonan downgrade bandwidth dengan data berikut:\nNama: xxxxxx\nID Pelanggan: xxxxxx\nEmail: xxxxxx\nBandwidth lama: xxxxxx\nBandwidth baru: xxxxxx\nNomor WhatsApp alternatif: 08xxxxxx\nLampiran foto KTP asli pelanggan terdaftar.\nTerima kasih.']},
  {id:'retensi-ok',n:'Berhasil diretensi',ciri:'Pelanggan membatalkan niat downgrade setelah retensi.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Kami menerima laporan pelanggan ingin mengajukan downgrade layanan dengan alasan xxxxxx. CSO berhasil melakukan tindakan retensi untuk mencegah downgrade.']},
  {id:'retensi-info',n:'Retensi dan edukasi syarat',ciri:'Pelanggan hanya menanyakan syarat dan ketentuan, atau tetap memilih downgrade setelah retensi dan edukasi.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Kami menerima laporan pelanggan ingin mengajukan downgrade layanan dengan alasan xxxxxx. CSO sudah melakukan retensi dan mengedukasi syarat dan ketentuan permohonan downgrade.']},
  {id:'bayar',n:'Edukasi pembayaran terlebih dahulu',ciri:'Pelanggan wajib membayar tagihan terlebih dahulu sebelum downgrade dapat diajukan.',tiket:[['Informasi — Downgrade','Closed by CSO','tutup']],
   d:['Kami menerima laporan pelanggan ingin mengajukan downgrade. CSO mengedukasi pembayaran terlebih dahulu karena terdapat tagihan aktif yang belum dibayarkan.']},
  {id:'belum-tl',n:'Belum ditindaklanjuti Sales SBU',ciri:'Pelanggan sudah mengajukan, namun ID Permohonan belum terbit pada menu Mutasi ICRM+.',tiket:[['Keluhan — Downgrade','Sales Ritel SBU']],
   d:['Kami menerima laporan pelanggan menanyakan permohonan downgrade yang sudah diajukan.','Berdasarkan tiket permohonan downgrade xxxxxx, pelanggan sudah mengajukan downgrade namun belum ditindaklanjuti oleh Sales SBU. ID Permohonan belum terbit pada menu Mutasi ICRM+ (bukti terlampir). Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu tindak lanjut segera. Terima kasih.']},
  {id:'belum-konf',n:'Belum terkonfigurasi melewati tanggal 24',ciri:'Pada Tracking Opportunity, permohonan belum terkonfigurasi dan sudah melewati tanggal 24.',tiket:[['Keluhan — Downgrade','CM Ritel Pusat']],
   d:['Kami menerima laporan pelanggan menanyakan permohonan downgrade yang sudah diajukan.','Berdasarkan Tracking Opportunity, permohonan downgrade belum terkonfigurasi dan saat ini sudah melewati tanggal 24. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu konfigurasi bandwidth pelanggan segera. Terima kasih.']},
  {id:'tagihan',n:'Sudah terkonfigurasi, tagihan belum sesuai',ciri:'Bandwidth sudah berubah, namun nominal tagihan belum sesuai.',tiket:[['Keluhan — Billing','Billing Ritel Pusat']],
   d:['Kami menerima laporan pelanggan menanyakan tagihan yang belum sesuai setelah pengajuan permohonan downgrade.','Layanan pelanggan sudah terkonfigurasi namun nominal tagihan tidak sesuai. CSO sudah membantu simulasi pembayaran (bukti terlampir). Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu penyesuaian nominal tagihan pelanggan segera. Terima kasih.']}]},

pro:{meta:'Flow pelayanan CSO saat muncul tiket proaktif ONT',pillLabel:'Jenis laporan pelanggan',

   {t:'Status billing:',sub:['**Belum lunas:** CSO mengedukasi pembayaran tagihan. Alur selesai.','**Lunas:** lanjutkan dengan memilih jenis laporan pelanggan di bawah.']}]}],
 cases:[

  {id:'non',n:'Non gangguan saja',ciri:'Pelanggan melaporkan hal di luar gangguan, baik informasi maupun keluhan.',

    '**Sudah ada tiket proaktif:** tanyakan kepada pelanggan, apakah jaringan di lokasi terkendala? (langkah tambahan CSO, extra mile)']},

dea:{meta:'Berhenti berlangganan ICONNET',
 sections:[
  {h:'Alur deaktivasi di ICRM+',ol:[
   'Pelanggan mengajukan permohonan deaktivasi.',
   'ID Permohonan muncul pada menu **Monitoring Deactivation** di ICRM+.',
   'CSO mengecek dua status pada menu tersebut: **Status Approve** dan **Status Dismantle**.',
   'Jika **Status Approve = Approved**, layanan internet pelanggan menjadi **isolir** dan Status Dismantle berubah menjadi **Waiting**.',
   'Jika **Status Dismantle = Approved**, perangkat atau modem pelanggan **sudah diambil** petugas.'],
   table:{cols:['Status','Artinya'],rows:[['**Status Approve**','Persetujuan oleh Manajer Penjualan dan Aktivasi Ritel.'],['**Status Dismantle**','Pengambilan perangkat oleh petugas.']]}},
  {h:'Syarat dan ketentuan',ol:[
   'Pelanggan wajib menyelesaikan tagihan berjalan yang aktif.',
   '**Denda:** pelanggan yang belum genap 1 tahun (12 bulan) berlangganan wajib membayar denda **Rp1.000.000** (sebelum PPN), sama untuk pelanggan baru dan eksisting. Informasi pembayaran denda dikonfirmasi setelah pengajuan diterima.',
   'Setelah pengajuan diproses, PLN Icon Plus berhak menarik perangkat yang dipinjamkan selama masa berlangganan.',
   'Pelanggan yang belum melunasi tagihan terakhir atau denda tidak dapat mengajukan pemasangan ICONNET di waktu mendatang.',
   {t:'**Blacklist:** PLN Icon Plus berhak melakukan blacklist pada pelanggan yang:',sub:['tidak membayar denda karena berlangganan kurang dari 12 bulan;','tidak membayar biaya bulanan selama 90 hari kalender (3 bulan);','menjual bandwidth, atau melakukan pemindahan, perubahan, atau penyalahgunaan terhadap jaringan dan layanan ICONNET yang tidak sesuai aturan.']}]},
  {h:'Retensi berdasarkan alasan pelanggan',open:null,note0:'CSO tidak boleh memberikan janji apa pun saat retensi.',table:{cols:['Alasan pelanggan','Tindakan CSO'],rows:[
   ['**Kendala jaringan berulang** (down, slow, loss, intermittent, dan sejenisnya)','Tawarkan perbaikan dengan membuatkan laporan gangguan yang dapat ditindaklanjuti.'],
   ['**Perbaikan terlalu lama**','Update pada tiket gangguan yang masih aktif dan eskalasikan agar perbaikannya dipercepat melalui **Formulir Eskalasi CSO Laporan Gangguan**.'],
   ['**Pindah lokasi** (rumah, kos, atau kontrakan)','Tawarkan layanan relokasi. Jika berminat, lanjut ke sub menu **Relokasi**. Jika tidak berminat, edukasi bahwa langganan dapat dilanjutkan oleh penghuni berikutnya dengan mengajukan perubahan data email dan nomor telepon terdaftar (sub menu **Perubahan Data Pelanggan**).']]},
   go:[['gg-no-internet','Buka No Internet'],['gg-internet-slow','Buka Internet Slow'],['gg-intermittent','Buka Intermittent'],['pl-relokasi','Buka Relokasi'],['pl-ubahdata','Buka Perubahan Data']],
   note:'**Retensi berhasil:** buat tiket pelaporan yang sesuai (misalnya gangguan atau eskalasi) dan catat dengan template "Berhasil diretensi". **Pelanggan tetap ingin deaktivasi:** lanjut ke tata cara pengajuan di bawah.'},
  {h:'Tata cara pengajuan deaktivasi',ol:[
   'Lakukan edukasi dan retensi terlebih dahulu.',
   'Jika pelanggan tetap ingin berhenti, sampaikan: **mengisi formulir dan memastikan seluruh data telah dilengkapi, kemudian mengirimkannya kembali. Formulir dan foto KTP digabungkan menjadi satu file dalam format PDF agar pengajuan dapat diproses.**'],pdf:true},
  {h:'Batal deaktivasi',note0:'Pelanggan ingin melanjutkan berlangganan setelah mengajukan deaktivasi. CSO mengedukasi pelanggan untuk melakukan pembayaran. Pilih tiket sesuai **Status Approve**.',table:{cols:['Status pengajuan','Tiket','Dikirim ke'],rows:[['**Belum approved**','Informasi — Batal Deaktivasi','Closed by CSO'],['**Sudah approved**','Keluhan — Batal Deaktivasi','Sales Ritel SBU']]}},
  {h:'Layanan tidak aktif (pelanggan melapor kendala jaringan)',note0:'Cek status pelanggan di ICRM+. Jika **Tidak Aktif**, konfirmasi apakah pelanggan pernah mengajukan berhenti berlangganan.',table:{cols:['Kondisi','Tindakan CSO'],rows:[
   ['**A. Pelanggan merasa tidak pernah mengajukan**','Cek apakah pelanggan masuk kategori **winback**.'],
   ['A1. Ya, masuk winback (potensi deaktivasi karena tidak bersedia winback)','Edukasi bahwa status berlangganan sudah tidak aktif. Jika berminat berlangganan kembali, pelanggan mengajukan permohonan berlangganan setelah proses deaktivasi selesai hingga pengambilan perangkat.'],
   ['A2. Tidak masuk winback','Cek menu **Monitoring Deactivation** di ICRM+.'],
   ['A2.1 Tidak ada pengajuan deaktivasi (keterangan layanan sudah tidak aktif)','Tiket Keluhan — Deaktivasi ke **Billing Ritel Pusat**.'],
   ['A2.2 Ada pengajuan deaktivasi','Tiket Keluhan — Deaktivasi ke **Sales Ritel SBU**. Asumsinya pengajuan bukan dari pelanggan.'],
   ['**B. Pelanggan merasa mengajukan**','Edukasi bahwa status berlangganan sudah tidak aktif. Jika berminat berlangganan kembali, ajukan permohonan berlangganan setelah proses deaktivasi selesai hingga pengambilan perangkat.']]}},
  {h:'Case lapangan: layanan terisolir setelah pengajuan disetujui',table:{cols:['Kondisi','Tindakan CSO'],rows:[
   ['**1. Status Approve sudah Approved, layanan terisolir, namun masih dalam periode penggunaan**','CSO **open isolir** melalui ICRM+ agar pelanggan dapat memakai sisa periode penggunaan. Lalu buat tiket Keluhan — Deaktivasi ke **Aktivasi Ritel Pusat** untuk percepatan dismantle (pengambilan perangkat). Pada Deskripsi 2, sebutkan bahwa pelanggan sudah dibantu open isolir.'],
   ['**2. Status Dismantle sudah Approved, namun modem masih di rumah pelanggan** (masih periode penggunaan, layanan terisolir)','**Dilarang open isolir.** Buat tiket Keluhan — Deaktivasi ke **Aktivasi Ritel Pusat** untuk percepatan dismantle (pengambilan perangkat).']]}}],
 cases:[
  {id:'cepat',n:'Percepatan persetujuan (Status Approve)',ciri:'Pengajuan sudah diinput di ICRM+, namun Status Approve belum Approved dan pelanggan menanyakan progres.',tiket:[['Keluhan — Deaktivasi','Sales Ritel SBU']],
   d:['Kami menerima laporan pelanggan menanyakan permohonan deaktivasi yang sudah diajukan.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, pelanggan sudah mengajukan berhenti berlangganan namun Status Approve belum Approved. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu percepatan proses persetujuan. Terima kasih.']},
  {id:'isolir',n:'Isolir, masih periode penggunaan',ciri:'Status Approve sudah Approved, layanan terisolir, masih dalam periode penggunaan. CSO sudah open isolir.',tiket:[['Keluhan — Deaktivasi','Aktivasi Ritel Pusat']],
   d:['Kami menerima laporan pelanggan menanyakan pengambilan perangkat atas permohonan deaktivasi yang sudah disetujui.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, Status Approve sudah Approved dan Status Dismantle masih Waiting. Layanan pelanggan terisolir meskipun masih dalam periode penggunaan, sehingga CSO sudah membantu open isolir agar pelanggan dapat menikmati sisa periode penggunaannya. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu percepatan dismantle atau pengambilan perangkat ke lokasi pelanggan. Terima kasih.']},
  {id:'dismantle',n:'Dismantle approved, modem masih di rumah',ciri:'Status Dismantle sudah Approved namun modem masih di rumah pelanggan. Dilarang open isolir.',tiket:[['Keluhan — Deaktivasi','Aktivasi Ritel Pusat']],
   d:['Kami menerima laporan pelanggan menanyakan pengambilan perangkat atas permohonan deaktivasi yang sudah disetujui.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, Status Dismantle sudah Approved namun modem masih berada di rumah pelanggan. Layanan pelanggan terisolir dan CSO tidak membantu open isolir. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu percepatan dismantle atau pengambilan perangkat ke lokasi pelanggan. Terima kasih.']},
  {id:'batal-info',n:'Batal deaktivasi, belum approved',ciri:'Pengajuan belum approved, pelanggan ingin melanjutkan berlangganan.',tiket:[['Informasi — Batal Deaktivasi','Closed by CSO','tutup']],
   d:['Kami menerima laporan pelanggan ingin membatalkan pengajuan deaktivasi dan melanjutkan berlangganan. Pengajuan belum approved. CSO mengedukasi pelanggan untuk melakukan pembayaran.']},
  {id:'batal-app',n:'Batal deaktivasi, sudah approved',ciri:'Pengajuan sudah approved, pelanggan ingin melanjutkan berlangganan.',tiket:[['Keluhan — Batal Deaktivasi','Sales Ritel SBU']],
   d:['Kami menerima laporan pelanggan ingin membatalkan pengajuan deaktivasi dan melanjutkan berlangganan.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, pengajuan sudah approved namun pelanggan ingin melanjutkan berlangganan. CSO sudah mengedukasi pelanggan untuk melakukan pembayaran. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu pembatalan deaktivasi. Terima kasih.']},
  {id:'tdk-ada',n:'Tidak merasa mengajukan, tidak ada pengajuan',ciri:'Status Tidak Aktif, bukan winback, dan tidak ada pengajuan di Monitoring Deactivation.',tiket:[['Keluhan — Deaktivasi','Billing Ritel Pusat']],
   d:['Kami menerima laporan pelanggan layanan tidak aktif dan merasa tidak pernah mengajukan berhenti berlangganan.','Status pelanggan pada ICRM+ "Tidak Aktif". Pelanggan tidak masuk kategori winback, dan pada menu Monitoring Deactivation tidak terdapat pengajuan deaktivasi, dengan keterangan layanan sudah tidak aktif. Pelanggan menyampaikan tidak pernah mengajukan berhenti berlangganan. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu pengecekan status pelanggan. Terima kasih.']},
  {id:'tdk-ada2',n:'Tidak merasa mengajukan, ada pengajuan',ciri:'Status Tidak Aktif, bukan winback, ada pengajuan di Monitoring Deactivation.',tiket:[['Keluhan — Deaktivasi','Sales Ritel SBU']],
   d:['Kami menerima laporan pelanggan layanan tidak aktif dan merasa tidak pernah mengajukan berhenti berlangganan.','Status pelanggan pada ICRM+ "Tidak Aktif". Pelanggan tidak masuk kategori winback, dan pada menu Monitoring Deactivation terdapat pengajuan deaktivasi (bukti terlampir), namun pelanggan menyampaikan tidak pernah mengajukan. Nomor WhatsApp alternatif: 08xxxxxx. Mohon dibantu pengecekan pengajuan tersebut. Terima kasih.']},
  {id:'retensi',n:'Berhasil diretensi',ciri:'Catatan pada tiket pelaporan yang sesuai (gangguan, eskalasi, dan sebagainya). Isi "dengan xxxxxx" sesuai tindakan retensi.',
   dl:['Template umum','Contoh: kendala berulang','Contoh: perbaikan terlalu lama','Contoh: pindah lokasi (relokasi)','Contoh: pindah lokasi (penghuni berikutnya)'],
   d:['Kami menerima laporan pelanggan ingin mengajukan berhenti berlangganan dengan alasan xxxxxx. CSO berhasil melakukan retensi dengan xxxxxx.','Kami menerima laporan pelanggan ingin mengajukan berhenti berlangganan dengan alasan kendala jaringan berulang. CSO berhasil melakukan retensi dengan membuatkan laporan gangguan yang dapat ditindaklanjuti.','Kami menerima laporan pelanggan ingin mengajukan berhenti berlangganan dengan alasan perbaikan terlalu lama. CSO berhasil melakukan retensi dengan mengupdate tiket gangguan aktif dan mengeskalasikan melalui Formulir Eskalasi CSO Laporan Gangguan.','Kami menerima laporan pelanggan ingin mengajukan berhenti berlangganan dengan alasan pindah lokasi. CSO berhasil melakukan retensi dengan menawarkan layanan relokasi.','Kami menerima laporan pelanggan ingin mengajukan berhenti berlangganan dengan alasan pindah lokasi. CSO berhasil melakukan retensi dengan mengedukasi bahwa langganan dapat dilanjutkan oleh penghuni berikutnya melalui perubahan data email dan nomor telepon terdaftar.']},
  {id:'info',n:'Hanya menanyakan syarat dan ketentuan',ciri:'Pelanggan hanya bertanya syarat dan ketentuan berhenti berlangganan.',tiket:[['Informasi — Deaktivasi','Closed by CSO','tutup']],

const mdb=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function plSim(){
  const iso=S.pl.d||(S.pl.d=knISO(new Date()));
  const r=knSim({e:'10 hari kerja',u:'HK'},iso);
  const inp=`<div class="q" style="margin:0 0 12px"><b>Tanggal pembayaran diterima atau status lunas pada Tracking Opportunity</b><input type="date" data-pl="1" value="${esc(iso)}" style="margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--tx);font:inherit"></div>`;
  if(!r)return `<div class="box"><h3>Simulasi estimasi SLA relokasi</h3>${inp}<div class="hint">Tanggal tidak valid.</div></div>`;
  const rows=[['Tanggal mulai',esc(knFmt(r.pay))],['Estimasi selesai','Paling lambat '+esc(knFmt(r.a))+' <span class="hint">(maksimal 10 hari kerja)</span>']];
  const hol=[...new Set(r.skipped.map(x=>knFmt(x)+' — '+knHM()[knISO(x)]))];
  if(hol.length)rows.push(['Tanggal merah dilewati',hol.map(esc).join('<br>')]);
  rows.push(['Status hari ini',r.passed?'<b>Sudah melewati estimasi</b>':'Belum melewati estimasi']);
  const warn=r.unc.length?`<div class="trw" role="note" style="margin:12px 0 0"><b>Internal.</b> Daftar tanggal merah tahun ${r.unc.join(', ')} belum diisi, jadi hanya Sabtu dan Minggu yang dilewati. Hubungi Admin untuk melengkapinya.</div>`:'';
  const go=r.passed?`<div class="trw" role="note" style="margin:12px 0 0"><b>Sudah melewati estimasi.</b> Buat tiket follow-up dismantle atau aktivasi. <button class="btn pri chip" data-a="plgo" data-card="rel" data-v="dismantle" style="margin-left:8px">Lihat tiket follow-up</button></div>`:'';
  const txt='Proses relokasi maksimal 10 hari kerja sejak pembayaran diterima. Pembayaran diterima pada '+knFmt(r.pay)+', sehingga estimasi proses selesai paling lambat '+knFmt(r.a)+'.';
  const i=S.pl.t.push(txt)-1;
  return `<div class="box"><h3>Simulasi estimasi SLA relokasi</h3>${inp}<table><tbody>${rows.map(([a,b])=>'<tr><td style="width:190px"><b>'+esc(a)+'</b></td><td>'+b+'</td></tr>').join('')}</tbody></table>${go}${warn}<div class="lab"><span>Salin penjelasan untuk pelanggan</span><button class="btn pri chip" data-a="plcopy" data-i="${i}" aria-label="Salin penjelasan untuk pelanggan" title="Salin penjelasan untuk pelanggan">Salin</button></div><div class="txt" style="white-space:pre-line">${esc(txt)}</div></div>`;
}
function viewPL(c){
  const D=PL_DATA[c.tool],g=GROUPS[c.group]||'';
  S.pl.t=[];
  const cur=D.cases.find(x=>x.id===S.pl.c[c.tool])||D.cases[0];S.pl.c[c.tool]=cur.id;
  const cp=(label,text)=>{const i=S.pl.t.push(text)-1;return `<div class="lab"><span>${esc(label)}</span><button class="btn pri chip" data-a="plcopy" data-i="${i}" aria-label="Salin ${esc(label)}" title="Salin ${esc(label)}">Salin</button></div><div class="txt" style="white-space:pre-line">${fillHTML(text)}</div>`};
  const li=x=>typeof x==='string'?'<li>'+mdb(x)+'</li>':'<li>'+mdb(x.t)+'<ul>'+x.sub.map(y=>'<li>'+mdb(y)+'</li>').join('')+'</ul></li>';
  const ol=a=>'<ol class="steps">'+a.map(li).join('')+'</ol>';
  const tbl=t=>'<table><thead><tr>'+t.cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+mdb(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  const sec=s=>{
    if(s.sim)return plSim();
    let b='<div class="box"><h3>'+esc(s.h)+'</h3>';
    if(s.note0)b+='<p class="hint" style="margin-top:0">'+mdb(s.note0)+'</p>';
    if(s.open)b+=cp('Kalimat pembuka',s.open);
    if(s.ol)b+=ol(s.ol);
    if(s.pdf&&!s.data&&!s.say)b+='<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>';
    if(s.say){b+=cp('Kalimat untuk pelanggan',s.say);if(s.pdf)b+='<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>'}
    if(s.table)b+=tbl(s.table);
    if(s.go)b+='<div class="tools" style="margin-top:10px">'+s.go.map(([id,l])=>`<button class="btn" data-a="open" data-id="${esc(id)}">${esc(l)}</button>`).join('')+'</div>';
    if(s.data){const t=s.data.map(x=>x+': xxxxxx').join('\n');b+=cp('Data yang ditanyakan',t)+(s.pdf?'<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>':'')+(s.note?'<p class="hint" style="margin-top:12px">'+mdb(s.note)+'</p>':'')}
    return b+'</div>';
  };
  const pills=D.cases.map(x=>`<button class="pill ${x.id===cur.id?'on':''}" data-a="plcase" data-card="${c.tool}" data-v="${x.id}" aria-pressed="${x.id===cur.id}">${esc(x.n)}</button>`).join('');
  const inter=D.internal?`<details class="box"><summary><b>${esc(D.internal.h)}</b></summary><div style="margin-top:10px">${D.internal.ol?ol(D.internal.ol):tbl(D.internal.table)}</div></details>`:'';
  return `<div class="head"><div><div class="titlerow">${icoTile(c,'lg')}<h1>${esc(g)} — ${esc(c.title)}</h1></div>
    <div class="meta">${esc(D.meta)}</div></div></div>
  ${D.note?`<div class="prio" role="note">${ic('alert',20)}<div>${mdb(D.note)}</div></div>`:''}
  ${D.sections.map(sec).join('')}
  <div class="box"><div class="q" style="margin:0"><b>${esc(D.pillLabel||'Kondisi pelanggan')}</b><div class="pills">${pills}</div></div></div>
  <div class="box gr"><h3>${esc(cur.n)}</h3><div class="hint" style="margin-top:0">${esc(cur.ciri)}</div>
    ${cur.steps?'<div class="subt">Langkah CSO</div>'+ol(cur.steps):''}
    ${(cur.tiket||[]).map(t=>tkHTML(tk(t[0],t[1],t[2]))).join('')}
    ${(cur.d||[]).map((t,i)=>cp(cur.dl?cur.dl[i]:cur.d.length>1?'Deskripsi '+(i+1):'Deskripsi',t)).join('')}</div>
  ${inter}`;
}

function viewTranslator(c){

  </div>
  ${S.role!=='agent'?`<div class="box"><h3>Istilah yang belum dikenali (celah kamus)</h3>${unk.length?`<table><tr><th>Baris laporan</th><th>Kali</th></tr>${unk.map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')}</table><div style="margin-top:8px"><button class="btn" data-a="trunkclear">Kosongkan daftar</button></div>`:'<p class="hint">Belum ada. Baris yang tidak dikenali muncul di sini setelah CSO menyalin hasil.</p>'}<p class="hint">Daftar ini tersimpan per browser sampai ada backend.</p></div>`:''}
  <details class="box"><summary><b>Kamus yang dipakai (${seen.size} istilah)</b></summary>
    <table style="margin-top:10px"><tr><th>Istilah di laporan</th><th>Jenis</th><th>Kalimat untuk pelanggan</th></tr>${rows}</table>
    <p class="hint">Setiap kalimat sudah divalidasi. Kalimat di luar kamus tidak pernah dikarang: bagian yang tidak dikenali diganti kalimat ringkas.</p></details>`;

function readForm(c){
  const fd=new FormData($('#cardForm'));const g=n=>(fd.get(n)||'').toString();
  const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  if(fd.has('group'))c.group=g('group');
  c.title=g('title').trim();c.short=g('short').trim();c.tujuan=g('tujuan').trim();
  c.note=g('note').trim();
  c.keywords=g('keywords').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  c.probing=lines(g('probing'));c.icrm=lines(g('icrm'));
  flat(c).forEach((e,i)=>{const b=e.u;
    b.steps=lines(g(`b${i}_steps`));b.ticket=Object.assign({},b.ticket,{kategori:g(`b${i}_kat`).trim(),tujuan:g(`b${i}_tuj`).trim()});
    b.desc1=g(`b${i}_d1`).trim();b.desc2=g(`b${i}_d2`).trim();
    const xs=xparse(g(`b${i}_x`));if(xs.length)b.extra=xs;else delete b.extra;
  });
  if(fd.has('title')&&document.querySelector('[name=usang]'))c.status=fd.has('usang')?'usang':'berlaku';
  return c;
}
function validateCard(c){
  if(!c.title)return'Judul wajib diisi.';
  for(const e of flat(c)){for(const k of ukeys(e.u)){if(!FIELDS[k])return`Isian {{${k}}} tidak dikenal. Gunakan: ${Object.keys(FIELDS).join(', ')}.`}}
  return'';
}
function restructure(c,group){
  const was=c.group;c.group=group;
  if(group==='informasi'&&c.questions.length){const b0=c.branches[0];b0.label='Ketentuan';b0.when={};c.questions=[];c.branches=[b0]}
  else if(group!=='informasi'&&!c.questions.length){const old=c.branches[0];const n=newCard(group);n.branches[0].steps=old.steps;n.branches[0].desc1=old.desc1;n.branches[0].desc2=old.desc2;n.branches[0].ticket=old.ticket;c.questions=n.questions;c.branches=n.branches;if(!c.icrm.length)c.icrm=clone(ICRM)}
  return was;
}

    const same=cards().filter(x=>x.group===c.group);

  holsave:()=>{
    const rows=readHol();
    if(rows.some(r=>!!r.d!==!!r.n)){toast('Lengkapi tanggal dan nama, atau hapus barisnya');return}
    const seen=new Set(),ok=[];
    for(const r of rows){if(!r.d)continue;if(!/^\d{4}-\d{2}-\d{2}$/.test(r.d)||isNaN(new Date(r.d))){toast('Tanggal tidak valid: '+r.d);return}if(seen.has(r.d)){toast('Tanggal dobel: '+r.d);return}seen.add(r.d);ok.push(r)}
    if(!ok.length){toast('Minimal satu tanggal');return}
    ok.sort((a,b)=>a.d.localeCompare(b.d));DB.holidays=ok;DB.holAt=Date.now();S.hdraft=null;knHolReset();logAct('ubah-libur',ok.length+' tanggal');save();renderMain();toast('Daftar tanggal merah disimpan ('+ok.length+')');

    DB.contacts=ok;S.cdraft=null;logAct('ubah-kontak',ok.length+' kontak');save();renderContacts();renderMain();toast('Kontak disimpan ('+ok.length+')');

    const m=S.modal;const r=m.type==='login'?$('#loginRole').value:m.role;
    if($('#pinIn').value===CONFIG.PINS[r]){
      try{sessionStorage.setItem('opal.role',r)}catch(e){}

  mic:()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Browser ini tidak mendukung pencarian suara');return}
    const r=new SR(),btn=$('#btnMic');r.lang='id-ID';r.interimResults=false;btn.classList.add('rec');
    r.onresult=e=>{$('#q').value=e.results[0][0].transcript;syncSearch();showResults(true)};
    r.onerror=()=>toast('Suara tidak terbaca');r.onend=()=>btn.classList.remove('rec');
    try{r.start();toast('Silakan bicara…')}catch(e){btn.classList.remove('rec')}
  },
  clear:()=>{const q=$('#q');q.value='';syncSearch();showResults(false);q.focus()},
  logout:()=>{try{sessionStorage.removeItem('opal.role')}catch(e){}S.role=null;S.view='home';S.caseId=null;S.modal=null;S.navOpen=false;['#nav','#main','#sidefoot','#trend'].forEach(x=>$(x).innerHTML='');renderAll()},

function readHol(){
  const f=new FormData($('#holForm'));const cs=S.hdraft||knHolList().slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  return cs.map((h,i)=>({d:(f.get('hd'+i)||'').toString().trim(),n:(f.get('hn'+i)||'').toString().trim()}));
}
function readContacts(){
  const f=new FormData($('#contactForm'));const cs=S.cdraft||contacts();
  return cs.map((c,i)=>({id:c.id,label:(f.get('l'+i)||'').toString().trim(),wa:(f.get('n'+i)||'').toString().trim()}));
}
function doSaveDraft(submit){
  const m=S.modal;const c=readForm(m.card);const e=validateCard(c);if(e){$('#formErr').textContent=e;return}
  c.updatedAt=Date.now();c.updatedBy=ROLE_SHORT[S.role];
  if(m.draftId){const d=DB.drafts.find(x=>x.id===m.draftId);d.card=c;d.at=Date.now();if(submit){d.status='diajukan';d.note=''}else if(d.status==='ditolak')d.status='draft';logAct(submit?'ajukan-draf':'simpan-draf',c.title)}
  else{DB.drafts.unshift({id:'d'+Date.now().toString(36),card:c,status:submit?'diajukan':'draft',by:ROLE_SHORT[S.role],at:Date.now(),note:''});logAct(submit?'ajukan-draf':'simpan-draf',c.title)}
  save();S.modal=null;S.view='drafts';renderAll();toast(submit?'Draf diajukan ke Trainer':'Draf disimpan');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t){if(!e.target.closest('#pop')&&!e.target.closest('[data-a=contact]'))$('#pop').hidden=true;if(!e.target.closest('.search'))$('#results').hidden=true;return}
  if(t.tagName==='INPUT')return;
  lastBtn=t;
  const f=H[t.dataset.a];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-a=usang]'))H.usang(t);
  if(t.matches('input[data-pl]')){S.pl.d=t.value||S.pl.d;renderMain();return}
  if(t.matches('input[data-kd]')){S.kn.d=t.value||S.kn.d;renderMain()}
  if(t.matches('[data-chk]')){S.checks[t.dataset.chk]=t.checked;t.closest('.chk').classList.toggle('done',t.checked)}
  if(t.id==='grpSel'&&S.modal&&S.modal.type==='form'){const c=readForm(S.modal.card);restructure(c,t.value);S.modal.card=c;renderModal()}
  if(t.id==='holFile'){
    const file=t.files[0];if(!file)return;
    file.text().then(x=>{try{
      const j=JSON.parse(x);if(!Array.isArray(j.holidays)||!j.holidays.length||j.holidays.some(h=>!/^\d{4}-\d{2}-\d{2}$/.test(h.d)))throw 0;
      DB.holidays=j.holidays.map(h=>({d:h.d,n:String(h.n||'')}));DB.holAt=Date.now();knHolReset();logAct('impor-libur',file.name);save();renderMain();toast('Impor berhasil: '+j.holidays.length+' tanggal');
    }catch(err){toast('File tidak valid')}});
  }
  if(t.id==='impFile'){
    const file=t.files[0];if(!file)return;
    file.text().then(x=>{try{
      const j=JSON.parse(x);if(!Array.isArray(j.cards)||j.cards.some(c=>!c.id||!c.title||!Array.isArray(c.branches)))throw 0;
      DB.cards={};j.cards.forEach(c=>{DB.cards[c.id]=c});if(Array.isArray(j.contacts)&&j.contacts.length)DB.contacts=j.contacts;
      logAct('impor',file.name);save();renderAll();toast('Impor berhasil: '+j.cards.length+' kartu');
    }catch(err){toast('File tidak valid')}});
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){S.fields[t.dataset.f]=t.value;const c=getCard(S.caseId);document.querySelectorAll('.tpl[data-u]').forEach(el=>{el.innerHTML=tplHTML(c,el.dataset.u)});const d=FIELDS[t.dataset.f];t.classList.toggle('bad',!!t.value&&!!d&&!d.ok(t.value.trim()))}
  if(t.id==='trIn'){trRun(t.value)}
  if(t.id==='trOut'){trGuard(t.value)}
  if(t.id==='q'){S.hit=0;syncSearch();showResults(false)}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='q'){
    if(e.key==='ArrowDown'&&S.results.length){e.preventDefault();S.hit=(S.hit+1)%S.results.length;showResults(false)}
    else if(e.key==='ArrowUp'&&S.results.length){e.preventDefault();S.hit=(S.hit-1+S.results.length)%S.results.length;showResults(false)}
    else if(e.key==='Enter'){showResults(true);if(S.results[S.hit])openCase(S.results[S.hit].c.id)}
    else if(e.key==='Escape')$('#results').hidden=true;
  }else if(e.key==='Enter'&&e.target.id==='pinIn')H.pinok();
  else if(e.key==='Escape'&&S.modal&&S.modal.type!=='login'){S.modal=null;renderRole();renderModal()}
  else if(e.key==='/'&&S.role&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
});
$('#roleSel').addEventListener('change',e=>{
  const r=e.target.value;e.target.value=S.role;
  if(r===S.role)return;
  S.modal={type:'pin',role:r};renderModal();
});

<script>
(()=>{const orb=document.getElementById('orb');if(!orb)return;const cv=orb.querySelector('.gcv'),iL=orb.querySelector('.ol'),iD=orb.querySelector('.od');if(!cv||!iL||!iD)return;
const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});if(!gl)return;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;uniform sampler2D tl,td;uniform vec2 res;uniform float t;uniform vec2 m;uniform float dk;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
vec3 smp(vec2 uv){vec3 a=texture2D(tl,uv).rgb,b=texture2D(td,uv).rgb;return mix(a,b,dk);}
float sat(vec3 c){return max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*nz(p);p=p*2.03+vec2(7.1,3.7);a*=.5;}return v;}
vec2 rot(vec2 p,float a){float s=sin(a),c=cos(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
vec3 hue(vec3 c,float a){vec3 ax=vec3(.57735);float s=sin(a),k=cos(a);return c*k+cross(ax,c)*s+ax*dot(ax,c)*(1.-k);}
vec3 tx(vec2 q){return smp(q*.5/1.04+.5);}
