pro:{meta:'Flow pelayanan CSO saat muncul tiket proaktif ONT',pillLabel:'Jenis laporan pelanggan',
 sections:[
  {h:'Langkah awal',ol:[
   'Verifikasi data pelanggan: nama, ID Pelanggan, nomor HP, dan data lain sesuai ketentuan.',
   'Cek status billing pelanggan di ICRM+.',
   {t:'Status billing:',sub:['**Belum lunas:** CSO mengedukasi pembayaran tagihan. Alur selesai.','**Lunas:** lanjutkan dengan memilih jenis laporan pelanggan di bawah.']}]}],
 cases:[
  {id:'gangguan',n:'Gangguan saja',ciri:'Pelanggan melaporkan gangguan.',
   steps:[{t:'Saat tiket gangguan dibuat, periksa apakah muncul pesan **sudah ada tiket proaktif ONT**.',sub:[
    '**Belum ada tiket proaktif:** buat tiket gangguan melalui ICRM+.',
    '**Sudah ada tiket proaktif:** buat tiket melalui ICRM+, lalu klik **Yes** pada pesan informasi tiket proaktif. Setelah itu update bubble ICRM+ pada tiket proaktif ONT sesuai gangguan yang dialami pelanggan.']}]},
  {id:'non',n:'Non gangguan saja',ciri:'Pelanggan melaporkan hal di luar gangguan, baik informasi maupun keluhan.',
   steps:[{t:'Saat tiket non gangguan dibuat, periksa apakah muncul pesan **sudah ada tiket proaktif ONT**.',sub:[
    '**Belum ada tiket proaktif:** buat tiket non gangguan melalui ICRM+.',
    '**Sudah ada tiket proaktif:** tanyakan kepada pelanggan, apakah jaringan di lokasi terkendala? (langkah tambahan CSO, extra mile)']},
    {t:'Jika jawaban pelanggan **ya, jaringan terkendala:**',sub:['Buat tiket melalui ICRM+, lalu klik **Yes** pada pesan informasi tiket proaktif.','Update bubble ICRM+ pada tiket proaktif ONT sesuai gangguan yang dialami pelanggan.','Buat tiket non gangguan melalui ICRM+ sesuai kebutuhan pelanggan.']},
    {t:'Jika jawaban pelanggan **tidak, jaringan tidak terkendala:**',sub:['Lakukan **force close** pada tiket gangguan proaktif ONT.','Buat tiket non gangguan melalui ICRM+ sesuai kebutuhan pelanggan.']}]},
  {id:'dua',n:'Gangguan dan non gangguan sekaligus',ciri:'Pelanggan melaporkan gangguan dan hal non gangguan dalam satu kontak.',
   steps:[{t:'Saat tiket dibuat, periksa apakah muncul pesan **sudah ada tiket proaktif ONT**.',sub:[
    '**Belum ada tiket proaktif:** buat tiket gangguan dan tiket non gangguan melalui ICRM+.',
    '**Sudah ada tiket proaktif:** buat tiket melalui ICRM+, lalu klik **Yes** pada pesan informasi tiket proaktif. Update bubble ICRM+ pada tiket proaktif ONT sesuai gangguan yang dialami pelanggan, lalu buat tiket non gangguan melalui ICRM+.']}]}]},

dea:{meta:'Berhenti berlangganan ICONNET',fold:true,
 groups:[['Ingin berhenti berlangganan',['mulai','retensi']],['Sudah mengajukan',['cepat','batal-info','batal-app']],['Layanan tidak aktif atau terisolir',['tdk-ada','tdk-ada2','edu','isolir','dismantle']],['Hanya bertanya',['info']]],
 sections:[
  {k:'alur',h:'Alur status di ICRM+',ol:[
   'Pelanggan mengajukan permohonan deaktivasi.',
   'CSO mengisi formulir di ICRM+. Setelah itu, **ID Permohonan** akan muncul.',
   'Pantau status permohonan di menu **Monitoring Deactivation** pada ICRM+.',
   'Ada dua status yang dicek: **Status Approve** (persetujuan) dan **Status Dismantle** (pengambilan modem).',
   '**Status Approve = Approved** artinya permohonan sudah disetujui Manajer Penjualan dan Aktivasi Ritel.',
   '**Status Dismantle = Approved** artinya modem pelanggan sudah diambil petugas.']},
  {k:'syarat',h:'Syarat dan ketentuan',ol:[
   'Pelanggan wajib menyelesaikan tagihan berjalan yang aktif.',
   '**Denda:** pelanggan yang belum genap 1 tahun (12 bulan) berlangganan wajib membayar denda **Rp1.000.000** (sebelum PPN), sama untuk pelanggan baru dan eksisting. Informasi pembayaran denda dikonfirmasi setelah pengajuan diterima.',
   'Setelah pengajuan diproses, PLN Icon Plus berhak menarik perangkat yang dipinjamkan selama masa berlangganan.',
   'Pelanggan yang belum melunasi tagihan terakhir atau denda tidak dapat mengajukan pemasangan ICONNET di waktu mendatang.',
   {t:'**Blacklist:** PLN Icon Plus berhak melakukan blacklist pada pelanggan yang:',sub:['tidak membayar denda karena berlangganan kurang dari 12 bulan;','tidak membayar biaya bulanan selama 90 hari kalender (3 bulan);','menjual bandwidth, atau melakukan pemindahan, perubahan, atau penyalahgunaan terhadap jaringan dan layanan ICONNET yang tidak sesuai aturan.']}]},
  {k:'retensi',h:'Retensi berdasarkan alasan pelanggan',open:null,note0:'CSO tidak boleh memberikan janji apa pun saat retensi.',table:{cols:['Alasan pelanggan','Tindakan CSO'],rows:[
   ['**Kendala jaringan berulang** (down, slow, loss, intermittent, dan sejenisnya)','Tawarkan perbaikan dengan membuatkan laporan gangguan yang dapat ditindaklanjuti.'],
   ['**Perbaikan terlalu lama**','Update pada tiket gangguan yang masih aktif dan eskalasikan agar perbaikannya dipercepat melalui **Formulir Eskalasi CSO Laporan Gangguan**.'],
   ['**Pindah lokasi** (rumah, kos, atau kontrakan)','Tawarkan layanan relokasi. Jika berminat, lanjut ke sub menu **Relokasi**. Jika tidak berminat, edukasi bahwa langganan dapat dilanjutkan oleh penghuni berikutnya dengan mengajukan perubahan data email dan nomor telepon terdaftar (sub menu **Perubahan Data Pelanggan**).']]},
   go:[['gg-no-internet','Buka No Internet'],['gg-internet-slow','Buka Internet Slow'],['gg-intermittent','Buka Intermittent'],['pl-relokasi','Buka Relokasi'],['pl-ubahdata','Buka Perubahan Data']]},
  {k:'tata',h:'Tata cara pengajuan deaktivasi',ol:[
   'Lakukan edukasi dan retensi terlebih dahulu.',
   'Jika pelanggan tetap ingin berhenti, sampaikan: **mengisi formulir dan memastikan seluruh data telah dilengkapi, kemudian mengirimkannya kembali. Formulir dan foto KTP digabungkan menjadi satu file dalam format PDF agar pengajuan dapat diproses.**'],pdf:true,go:[['pl-pdftool','Buka Alat PDF']]}],
 cases:[
  {id:'mulai',n:'Ingin berhenti berlangganan',ciri:'Pelanggan menyatakan ingin berhenti berlangganan.',open:['retensi','tata','syarat'],
   steps:['Tanyakan alasan pelanggan, lalu lakukan edukasi dan retensi sesuai tabel **Retensi berdasarkan alasan pelanggan** di bawah. CSO tidak boleh memberikan janji apa pun.','**Retensi berhasil:** buat tiket pelaporan yang sesuai (misalnya gangguan atau eskalasi) dan catat dengan template pada kasus **Berhasil diretensi**.','**Pelanggan tetap ingin berhenti:** sampaikan **Tata cara pengajuan deaktivasi** di bawah, termasuk syarat dan ketentuan. Setelah formulir diterima, CSO menginput formulir pada ICRM+ (lihat **Alur status di ICRM+**).','Jika formulir dan foto KTP dikirim **terpisah atau bukan PDF**, gabungkan menjadi satu PDF dengan **Alat PDF** (tombol pada bagian Tata cara pengajuan di bawah).']},
  {id:'retensi',n:'Berhasil diretensi',ciri:'Catatan pada tiket pelaporan yang sesuai (gangguan, eskalasi, dan sebagainya). Isi "dengan xxxxxx" sesuai tindakan retensi.',
   dl:['Template umum','Contoh: kendala berulang','Contoh: perbaikan terlalu lama','Contoh: pindah lokasi (relokasi)','Contoh: pindah lokasi (penghuni berikutnya)'],
   d:['Pelanggan ingin mengajukan berhenti berlangganan dengan alasan xxxxxx. CSO berhasil melakukan retensi dengan xxxxxx.','Pelanggan ingin mengajukan berhenti berlangganan dengan alasan kendala jaringan berulang. CSO berhasil melakukan retensi dengan membuatkan laporan gangguan yang dapat ditindaklanjuti.','Pelanggan ingin mengajukan berhenti berlangganan dengan alasan perbaikan terlalu lama. CSO berhasil melakukan retensi dengan mengupdate tiket gangguan aktif dan mengeskalasikan melalui Formulir Eskalasi CSO Laporan Gangguan.','Pelanggan ingin mengajukan berhenti berlangganan dengan alasan pindah lokasi. CSO berhasil melakukan retensi dengan menawarkan layanan relokasi.','Pelanggan ingin mengajukan berhenti berlangganan dengan alasan pindah lokasi. CSO berhasil melakukan retensi dengan mengedukasi bahwa langganan dapat dilanjutkan oleh penghuni berikutnya melalui perubahan data email dan nomor telepon terdaftar.']},
  {id:'cepat',n:'Percepatan persetujuan (Status Approve)',ciri:'Pengajuan sudah diinput di ICRM+, namun Status Approve belum Approved dan pelanggan menanyakan progres.',open:['alur'],steps:['Cek **Monitoring Deactivation** di ICRM+: Status Approve belum Approved.','Buat tiket di bawah untuk percepatan persetujuan.'],tiket:[['Keluhan — Deaktivasi','Sales Ritel SBU']],
   d:['Pelanggan menanyakan permohonan deaktivasi yang sudah diajukan.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, pelanggan sudah mengajukan berhenti berlangganan namun Status Approve belum Approved. Nomor alternatif: 08xxxxxx. Mohon dibantu percepatan proses persetujuan. Terima kasih.']},
  {id:'batal-info',n:'Batal deaktivasi, belum approved',ciri:'Pengajuan belum approved, pelanggan ingin melanjutkan berlangganan.',open:['alur'],steps:['Edukasi pelanggan untuk melakukan pembayaran.','Buat tiket di bawah (Status Approve belum Approved).'],tiket:[['Informasi — Batal Deaktivasi','Closed by CSO','tutup']],
   d:['Pelanggan ingin membatalkan pengajuan deaktivasi dan melanjutkan berlangganan. Pengajuan belum approved. CSO mengedukasi pelanggan untuk melakukan pembayaran.']},
  {id:'batal-app',n:'Batal deaktivasi, sudah approved',ciri:'Pengajuan sudah approved, pelanggan ingin melanjutkan berlangganan.',open:['alur'],steps:['Edukasi pelanggan untuk melakukan pembayaran.','Buat tiket di bawah (Status Approve sudah Approved).'],tiket:[['Keluhan — Batal Deaktivasi','Sales Ritel SBU']],
   d:['Pelanggan ingin membatalkan pengajuan deaktivasi dan melanjutkan berlangganan.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, pengajuan sudah approved namun pelanggan ingin melanjutkan berlangganan. CSO sudah mengedukasi pelanggan untuk melakukan pembayaran. Nomor alternatif: 08xxxxxx. Mohon dibantu pembatalan deaktivasi. Terima kasih.']},
  {id:'tdk-ada',n:'Tidak merasa mengajukan, tidak ada pengajuan',ciri:'Status Tidak Aktif, bukan winback, dan tidak ada pengajuan di Monitoring Deactivation.',steps:['Cek status pelanggan di ICRM+. Jika **Tidak Aktif**, konfirmasi apakah pelanggan pernah mengajukan berhenti berlangganan.','Pelanggan merasa tidak pernah mengajukan: cek apakah masuk kategori **winback**.','Jika tidak masuk winback, cek menu **Monitoring Deactivation** di ICRM+.','Tidak ada pengajuan deaktivasi (keterangan layanan sudah tidak aktif): buat tiket di bawah.'],tiket:[['Keluhan — Deaktivasi','Billing Ritel Pusat']],
   d:['Pelanggan layanan tidak aktif dan merasa tidak pernah mengajukan berhenti berlangganan.','Status pelanggan pada ICRM+ "Tidak Aktif". Pelanggan tidak masuk kategori winback, dan pada menu Monitoring Deactivation tidak terdapat pengajuan deaktivasi, dengan keterangan layanan sudah tidak aktif. Pelanggan menyampaikan tidak pernah mengajukan berhenti berlangganan. Nomor alternatif: 08xxxxxx. Mohon dibantu pengecekan status pelanggan. Terima kasih.']},
  {id:'tdk-ada2',n:'Tidak merasa mengajukan, ada pengajuan',ciri:'Status Tidak Aktif, bukan winback, ada pengajuan di Monitoring Deactivation.',steps:['Cek status pelanggan di ICRM+. Jika **Tidak Aktif**, konfirmasi apakah pelanggan pernah mengajukan berhenti berlangganan.','Pelanggan merasa tidak pernah mengajukan: cek apakah masuk kategori **winback**.','Jika tidak masuk winback, cek menu **Monitoring Deactivation** di ICRM+.','Ada pengajuan deaktivasi: buat tiket di bawah. Asumsinya pengajuan bukan dari pelanggan.'],tiket:[['Keluhan — Deaktivasi','Sales Ritel SBU']],
   d:['Pelanggan layanan tidak aktif dan merasa tidak pernah mengajukan berhenti berlangganan.','Status pelanggan pada ICRM+ "Tidak Aktif". Pelanggan tidak masuk kategori winback, dan pada menu Monitoring Deactivation terdapat pengajuan deaktivasi (bukti terlampir), namun pelanggan menyampaikan tidak pernah mengajukan. Nomor alternatif: 08xxxxxx. Mohon dibantu pengecekan pengajuan tersebut. Terima kasih.']},
  {id:'edu',n:'Edukasi status tidak aktif',ciri:'Pelanggan winback atau merasa mengajukan, layanan sudah tidak aktif.',steps:['Cek status pelanggan di ICRM+. Jika **Tidak Aktif**, konfirmasi apakah pelanggan pernah mengajukan berhenti berlangganan.',{t:'Pelanggan masuk **winback** (potensi deaktivasi karena tidak bersedia winback), **atau** pelanggan merasa mengajukan:',sub:['Edukasi bahwa status berlangganan sudah tidak aktif.','Jika berminat berlangganan kembali, pelanggan mengajukan permohonan berlangganan setelah proses deaktivasi selesai hingga pengambilan perangkat.','Buat tiket di bawah.']}],tiket:[['Informasi — Deaktivasi','Closed by CSO','tutup']],
   d:['Pelanggan menanyakan layanan yang tidak aktif. CSO mengedukasi bahwa status berlangganan sudah tidak aktif, dan jika berminat berlangganan kembali, pelanggan dapat mengajukan permohonan berlangganan setelah proses deaktivasi selesai hingga pengambilan perangkat.']},
  {id:'isolir',n:'Isolir, masih periode penggunaan',ciri:'Status Approve sudah Approved, layanan terisolir, masih dalam periode penggunaan. CSO sudah open isolir.',open:['alur'],steps:['CSO **open isolir** melalui ICRM+ agar pelanggan dapat memakai sisa periode penggunaan.','Buat tiket di bawah untuk percepatan dismantle (pengambilan perangkat). Pada Deskripsi 2 disebutkan bahwa pelanggan sudah dibantu open isolir.'],tiket:[['Keluhan — Deaktivasi','Aktivasi Ritel Pusat']],
   d:['Pelanggan menanyakan pengambilan perangkat atas permohonan deaktivasi yang sudah disetujui.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, Status Approve sudah Approved dan Status Dismantle masih Waiting. Layanan pelanggan terisolir meskipun masih dalam periode penggunaan, sehingga CSO sudah membantu open isolir agar pelanggan dapat menikmati sisa periode penggunaannya. Nomor alternatif: 08xxxxxx. Mohon dibantu percepatan dismantle atau pengambilan perangkat ke lokasi pelanggan. Terima kasih.']},
  {id:'dismantle',n:'Dismantle approved, modem masih di rumah',ciri:'Status Dismantle sudah Approved namun modem masih di rumah pelanggan. Dilarang open isolir.',open:['alur'],steps:['**Dilarang open isolir.**','Buat tiket di bawah untuk percepatan dismantle (pengambilan perangkat).'],tiket:[['Keluhan — Deaktivasi','Aktivasi Ritel Pusat']],
   d:['Pelanggan menanyakan pengambilan perangkat atas permohonan deaktivasi yang sudah disetujui.','Merujuk pada ID Permohonan Deaktivasi xxxxxx, Status Dismantle sudah Approved namun modem masih berada di rumah pelanggan. Layanan pelanggan terisolir dan CSO tidak membantu open isolir. Nomor alternatif: 08xxxxxx. Mohon dibantu percepatan dismantle atau pengambilan perangkat ke lokasi pelanggan. Terima kasih.']},
  {id:'info',n:'Hanya menanyakan syarat dan ketentuan',ciri:'Pelanggan hanya bertanya syarat dan ketentuan berhenti berlangganan.',open:['syarat'],steps:['Edukasi syarat dan ketentuan berhenti berlangganan pada bagian di bawah.','Buat tiket di bawah.'],tiket:[['Informasi — Deaktivasi','Closed by CSO','tutup']],
   d:['Pelanggan menanyakan berhenti berlangganan. CSO mengedukasi syarat dan ketentuan berhenti berlangganan yang berlaku.']}]},

pdt:{meta:'Mengubah data email dan nomor telepon terdaftar',
 sections:[
  {h:'Probing',data:['ID Pelanggan','Nama terdaftar','Nomor telepon (terdaftar sebelumnya)','Nomor telepon (terbaru)','Email (terdaftar sebelumnya)','Email (terbaru)']},
  {h:'Syarat verifikasi sebelum AKAD',ol:['**ID Pelanggan**','**Nama terdaftar**','**Salah satu** dari nomor telepon atau email terdaftar sebelumnya'],note0:'Pelanggan **wajib mengetahui** ketiga hal di bawah. Jika terpenuhi, baru AKAD perubahan data dapat dilakukan. Jika pelanggan **tidak dapat menyebutkan salah satu email atau nomor telepon terdaftar** (syarat ketiga), pelanggan **wajib melampirkan foto SN di bagian belakang modem melalui live chat MyICON+**. Jika foto SN tidak dilampirkan, perubahan data tidak dapat diproses.'}],
 cases:[
  {id:'berhasil',n:'Perubahan data berhasil',ciri:'Verifikasi terpenuhi dan AKAD perubahan data sudah dilakukan.',tiket:[['Informasi — Ubah Data','Closed by CSO','tutup']],
   d:['Pelanggan ingin mengubah data email dan nomor telepon terdaftar. CSO sudah melakukan AKAD dan perubahan data berhasil dilakukan.']},
  {id:'sn',n:'Tidak dapat menyebutkan email atau nomor terdaftar (foto SN modem)',ciri:'ID Pelanggan dan nama terdaftar sudah sesuai, tetapi pelanggan tidak dapat menyebutkan salah satu email atau nomor telepon terdaftar sebelumnya.',
   steps:['Pastikan **ID Pelanggan** dan **nama terdaftar** sudah sesuai.','Sampaikan bahwa pelanggan **wajib melampirkan foto SN di bagian belakang modem melalui live chat MyICON+**.','Jika foto SN sudah diterima dan sesuai, lakukan **AKAD** perubahan data, lalu buat tiket di bawah.','Jika foto SN belum dilampirkan, perubahan data belum dapat diproses. Gunakan kondisi **Belum berhasil, edukasi syarat**.'],
   tiket:[['Informasi — Ubah Data','Closed by CSO','tutup']],

const mdb=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function plSim(){
  const iso=S.pl.d||(S.pl.d=knISO(new Date()));
  const r=knSim({e:'10 hari kerja',u:'HK'},iso);
  const inp=`<div class="q" style="margin:0 0 12px"><b>Tanggal email persetujuan (ID Rxxxxx) diterima</b><input type="date" data-pl="1" value="${esc(iso)}" style="margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--tx);font:inherit"></div>`;
  if(!r)return `<div class="box"><h3>Simulasi estimasi SLA relokasi</h3>${inp}<div class="hint">Tanggal tidak valid.</div></div>`;
  const rows=[['Tanggal mulai',esc(knFmt(r.pay))],['Estimasi selesai','Paling lambat '+esc(knFmt(r.a))+' <span class="hint">(maksimal 10 hari kerja)</span>']];
  const hol=[...new Set(r.skipped.map(x=>knFmt(x)+' — '+knHM()[knISO(x)]))];
  if(hol.length)rows.push(['Tanggal merah dilewati',hol.map(esc).join('<br>')]);
  rows.push(['Status hari ini',r.passed?'<b>Sudah melewati estimasi</b>':'Belum melewati estimasi']);
  const warn=r.unc.length?`<div class="trw" role="note" style="margin:12px 0 0"><b>Internal.</b> Daftar tanggal merah tahun ${r.unc.join(', ')} belum diisi, jadi hanya Sabtu dan Minggu yang dilewati. Hubungi Admin untuk melengkapinya.</div>`:'';
  const go=r.passed?`<div class="trw" role="note" style="margin:12px 0 0"><b>Sudah melewati estimasi.</b> Buat tiket follow-up dismantle atau aktivasi. <button class="btn pri chip" data-a="plgo" data-card="rel" data-v="dismantle" style="margin-left:8px">Lihat tiket follow-up</button></div>`:'';
  const txt='Relokasi maksimal 10 hari kerja sejak pengajuan disetujui (email ID Rxxxxx diterima '+knFmt(r.pay)+'), jadi estimasi selesai paling lambat '+knFmt(r.a)+'.';
  const i=S.pl.t.push(txt)-1;
  return `<div class="box"><h3>Simulasi estimasi SLA relokasi</h3>${inp}<table><tbody>${rows.map(([a,b])=>'<tr><td style="width:190px"><b>'+esc(a)+'</b></td><td>'+b+'</td></tr>').join('')}</tbody></table>${go}${warn}<div class="lab"><span>Salin penjelasan untuk pelanggan</span><button class="btn pri chip" data-a="plcopy" data-i="${i}" aria-label="Salin penjelasan untuk pelanggan" title="Salin penjelasan untuk pelanggan">Salin</button></div><div class="txt" style="white-space:pre-line">${esc(txt)}</div></div>`;
}
function viewPL(c){
  const D=PL_DATA[c.tool],g=GROUPS[c.group]||'';
  S.pl.t=[];
  const cur=D.cases.find(x=>x.id===S.pl.c[c.tool])||D.cases[0];S.pl.c[c.tool]=cur.id;
  const cp=(label,text)=>{const i=S.pl.t.push(text)-1;return `<div class="lab"><span>${esc(label)}</span><button class="btn pri chip" data-a="plcopy" data-i="${i}" aria-label="Salin ${esc(label)}" title="Salin ${esc(label)}">Salin</button></div><div class="txt" style="white-space:pre-line">${fillHTML(text)}</div>`};
  const li=x=>typeof x==='string'?'<li>'+mdb(x)+'</li>':'<li>'+mdb(x.t)+'<ul>'+x.sub.map(y=>'<li>'+mdb(y)+'</li>').join('')+'</ul></li>';
  const ol=a=>'<ol class="steps">'+a.map(li).join('')+'</ol>';

      if(!sel)return b+'<p class="hint" style="margin-bottom:0">Pilih merek ONT pelanggan (lihat menu Teknis di ICRM+).</p></div>';

      const ganti=base.concat(['Pilih menu **'+sel.nama+'** untuk mengganti nama Wi-Fi (username SSID).','Pilih menu **'+sel.sandi+'** untuk mengganti password Wi-Fi. Password baru minimal 8 karakter.','Klik **'+sel.save+'**.']);
      const gt='Cara mengganti nama dan password Wi-Fi (modem '+sel.n+'):\n'+ganti.map((x,i)=>(i+1)+'. '+strip(x)).join('\n')+'\n\nSetelah disimpan, semua perangkat akan terputus dari Wi-Fi dan perlu dihubungkan kembali dengan password baru.';
      b+='<div class="subt">Ganti nama dan password Wi-Fi</div>'+ol(ganti)+cp('Panduan untuk pelanggan',gt);
      b+='<div class="subt">Cek perangkat terhubung</div>';
      if(!sel.cek)b+='<p class="hint">Panduan cek perangkat terhubung untuk merek ini belum tersedia.</p>';
      else{
        const cb=['Pastikan PC dan modem sudah terkoneksi.','Buka browser Google Chrome.','Ketik di address bar **'+sel.cekip+'**.'];
        if(sel.cekLogin)cb.push('Masukkan username **user** dan password **user1234** (atau cek di belakang perangkat).');
        const cek=cb.concat(sel.cek);
        b+=ol(cek)+cp('Panduan cek perangkat untuk pelanggan','Cara cek perangkat yang terhubung (modem '+sel.n+'):\n'+cek.map((x,i)=>(i+1)+'. '+strip(x)).join('\n'));
      }
      return b+'</div>';
    }
    let b='<div class="box"><h3>'+esc(s.h)+'</h3>';
    if(s.note0)b+='<p class="hint" style="margin-top:0">'+mdb(s.note0)+'</p>';
    if(s.open)b+=cp('Kalimat pembuka',s.open);
    if(s.ol)b+=ol(s.ol);
    if(s.pdf&&!s.data&&!s.say)b+='<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>';
    if(s.say){b+=cp('Kalimat untuk pelanggan',s.say);if(s.pdf)b+='<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>'}
    if(s.table)b+=tbl(s.table);
    if(s.pdf2)b+='<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf2">Unduh daftar channel ICONPLAY (PDF)</button></div>';
    if(s.go)b+='<div class="tools" style="margin-top:10px">'+s.go.map(([id,l])=>`<button class="btn" data-a="open" data-id="${esc(id)}">${esc(l)}</button>`).join('')+'</div>';
    if(s.data){const t=s.data.map(x=>x+': xxxxxx').join('\n');b+=cp('Data yang ditanyakan',t)+(s.pdf?'<div class="tools" style="margin-top:12px"><button class="btn pri" data-a="plpdf">Unduh formulir pengajuan berhenti berlangganan (PDF)</button></div>':'')+(s.note?'<p class="hint" style="margin-top:12px">'+mdb(s.note)+'</p>':'')}
    return b+'</div>';
  };
  const pill=x=>`<button class="pill ${x.id===cur.id?'on':''}" data-a="plcase" data-card="${c.tool}" data-v="${x.id}" aria-pressed="${x.id===cur.id}">${isTC(c,x.id)&&c.group!=='gangguan'?'★ ':''}${esc(x.n)}</button>`;
  const pills=D.groups?D.groups.map(([gh,ids])=>'<div class="subt" style="margin:12px 0 6px">'+esc(gh)+'</div><div class="pills">'+ids.map(id=>pill(D.cases.find(x=>x.id===id))).join('')+'</div>').join(''):D.cases.map(pill).join('');
  const fold=D.fold?D.sections.map(s=>{const o=!!s.o||(cur.open||[]).includes(s.k);const h=sec(s).replace(/^<div class="box"><h3>.*?<\/h3>/,'').replace(/<\/div>$/,'');return `<details class="box" ${o?'open':''}><summary><b>${esc(s.h)}</b></summary><div style="margin-top:10px">${h}</div></details>`}).join(''):'';
  const inter=D.internal?`<details class="box"><summary><b>${esc(D.internal.h)}</b></summary><div style="margin-top:10px">${D.internal.ol?ol(D.internal.ol):tbl(D.internal.table)}</div></details>`:'';
  return `<div class="head"><div><div class="titlerow">${icoTile(c,'lg')}<h1>${esc(g)} — ${esc(c.title)}</h1></div>
    <div class="meta">${esc(D.meta)}</div></div></div>
  ${D.note?`<div class="prio" role="note">${ic('alert',20)}<div>${mdb(D.note)}</div></div>`:''}
  ${D.fold?'':D.sections.map(sec).join('')}
  ${D.cases.length>1?`<div class="box"><div class="q" style="margin:0"><b>${esc(D.pillLabel||'Kondisi pelanggan')}</b>${D.groups?pills:'<div class="pills">'+pills+'</div>'}</div></div>`:''}

    ${cur.steps?'<div class="subt">Langkah CSO</div>'+ol(cur.steps):''}
    ${(cur.tiket||[]).map(t=>tkHTML(tk(t[0],t[1],t[2]))).join('')}
    ${(cur.d||[]).map((t,i)=>cp(cur.dl?cur.dl[i]:cur.d.length>1?'Deskripsi '+(i+1):'Deskripsi',t)).join('')}</div>
  ${fold}
  ${inter}`;
}

let _plp;async function pdfLib(){if(window.PDFLib)return window.PDFLib;if(!_plp)_plp=new Promise((ok,no)=>{const e=document.createElement('script');e.src='assets/pdf-lib.min.js';e.onload=ok;e.onerror=()=>{_plp=null;no(new Error('pdf-lib gagal dimuat'))};document.head.appendChild(e)});await _plp;return window.PDFLib}
const PT=()=>S.pt||(S.pt={files:[],name:'',small:true,msg:'',busy:false,seq:0});
const ptKB=n=>n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';
function ptAdd(list){
  const P=PT();let bad=[];
  list.forEach(f=>{
    const n=f.name||'file',low=n.toLowerCase();
    const pdf=f.type==='application/pdf'||low.endsWith('.pdf');
    const docx=low.endsWith('.docx')||f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    const img=/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/.test(low);
    if(pdf||img||docx)P.files.push({id:++P.seq,file:f,name:n,size:f.size,kind:pdf?'pdf':docx?'word':'foto'});else bad.push(n);
  });
  P.msg='';
  if(bad.length)toast('File tidak didukung: '+bad.join(', ')+'. Minta pelanggan kirim foto, PDF, atau Word (.docx).');
  renderMain();
}

async function ptBuild(){
  const P=PT();if(!P.files.length||P.busy)return;
  P.busy=true;P.msg='';renderMain();
  let cur='';
  try{
    const L=await pdfLib();const doc=await L.PDFDocument.create();
    for(const f of P.files){
      cur=f.name;
      if(f.kind==='pdf'){
        const src=await L.PDFDocument.load(await f.file.arrayBuffer());
        (await doc.copyPages(src,src.getPageIndices())).forEach(x=>doc.addPage(x));
      }else if(f.kind==='word')await ptDocx(L,doc,f);
      else await ptImagePage(L,doc,f,P.small);
    }
    const bytes=await doc.save();
    const nm=((P.name||'').trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\.pdf$/i,'')||'Gabungan')+'.pdf';
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    P.msg='Selesai: '+doc.getPageCount()+' halaman, '+ptKB(bytes.length)+', file '+nm+'.';
    toast('Berhasil: PDF diunduh');
  }catch(err){
    P.msg=err&&err.userMsg||('Gagal memproses'+(cur?' file "'+cur+'"':'')+'. File mungkin rusak atau PDF terkunci kata sandi. Hapus file itu dari daftar atau minta pelanggan mengirim ulang.');
    toast('Gagal memproses file');
  }
  P.busy=false;renderMain();
}

const qHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const qRng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const qShuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const qTxt=t=>String(t&&t.t!==undefined?t.t:t||'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();

          exp:'Probing ini khas untuk kartu '+short(c)+'. Pilihan lain adalah probing khas kartu yang berbeda.'})}

function qzKliring(date,c,n,used){

  for(const k of [1,-1,2,-2]){const d=kal?new Date(rr.b.getTime()+k*864e5):(k>0?qzAddWork(rr.b,k,false):null);if(d)add(d)}

    opts:o.opts,a:o.a,

function qzPick(P,date){

function favDock(){

/* ====== EDIT DATA KARTU ALAT (Kanal Pembayaran, Produk) ====== */
const TD_ID={kanal:'pb-kanal',produk:'pr-reguler-hebat'};
let TD0=null,TDG0=null,TDR=null;const TDV={};
const tdClone=x=>JSON.parse(JSON.stringify(x));
function tdReg(){
  if(TDR)return TDR;
  TDR={
   btl:{id:'pr-btl',t:{BT_PROG,BT_REG,BT_META}},
   biz:{id:'pr-biz',t:{BZ_REG,BZ_PKT,BZ_RING,BZ_SYR,BZ_CC,BZ_FLOW,BZ_META}},
   khusus:{id:'pr-khusus',t:{PK_PROG,PK_META}},
   bhma:{id:'pr-bhma',t:{BH_PROG,BH_META}},
   peks:{id:'pr-pleks',t:{PE_D,PE_META}},
   addon:{id:'pb-addon-x',t:{AO_SH,AO_WX,AO_META}},
   siklus:{id:'pb-siklus',t:{SG_D,SG_HC}}
  };
  TDR.addon.id='pr-addon';
  for(const[t,cf]of Object.entries(TDR))TD_ID[t]=cf.id;
  TDG0={};for(const cf of Object.values(TDR))for(const[nm,tg]of Object.entries(cf.t))TDG0[nm]=tdClone(tg);
  return TDR;
}
function tdAssign(tg,src){if(Array.isArray(tg))tg.splice(0,tg.length,...src);else{for(const k of Object.keys(tg))delete tg[k];Object.assign(tg,src)}}
function applyTD(){
  applyCases();
  const R=tdReg();
  if(!TD0)TD0={kn:tdClone(KN),reg:tdClone(PR_REG),otc:tdClone(PR_OTC),ket:[...PR_KET],meta:tdClone(PR_META)};
  for(const t of['kanal','produk']){
    const c=getCard(TD_ID[t]);const td=c&&c.td&&c.td.tool===t?c.td:null;const ver=td?(c.v||1):0;
    if(TDV[t]===ver)continue;TDV[t]=ver;
    if(t==='kanal')KN.splice(0,KN.length,...tdClone(td?td.kn:TD0.kn));
    else{PR_REG.splice(0,PR_REG.length,...tdClone(td?td.reg:TD0.reg));Object.assign(PR_OTC,tdClone(td?td.otc:TD0.otc));PR_KET.splice(0,PR_KET.length,...(td?td.ket:TD0.ket));Object.assign(PR_META,tdClone(td?td.meta:TD0.meta))}
  }
  for(const[t,cf]of Object.entries(R)){

const xn=x=>norm(x).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function xIndex(cur){
  const cs=new Map(),cd=[];
  for(const c of cards()){if(c.status==='usang')continue;
    cd.push({c,keys:[xn(c.title.replace(/\(.*?\)/g,'')),xn(c.short||'')].filter(Boolean)});
    if(c.tool){const arr=cdArr(c);if(arr)arr.forEach(x=>{const k=xn(x.n);if(!cs.has(k))cs.set(k,[]);cs.get(k).push({card:c,id:x.id,n:x.n})})}}
  return{cs,cd}}
function xFindCase(name,X,cur){const a=X.cs.get(xn(name));if(!a)return null;return a.find(t=>t.card.id===cur.id)||a[0]}
function xFindCasePrefix(name,X,cur){const k=xn(name);if(k.length<6)return null;
  const hits=[];X.cs.forEach((a,key)=>{if(key.startsWith(k)||(key.length>=8&&k.startsWith(key)))a.forEach(t=>hits.push(t))});
  const mine=hits.filter(t=>t.card.id===cur.id);const pool=mine.length?mine:hits;return pool.length===1?pool[0]:null}
function xFindCard(name,X,cur){const k=xn(name);if(k.length<4)return null;
  const hits=X.cd.filter(e=>e.keys.some(z=>z===k));if(!hits.length)return null;
  const pick=hits.find(e=>e.c.group===cur.group&&e.c.id!==cur.id)||hits.find(e=>e.c.id!==cur.id)||null;return pick?pick.c:null}
function xrefDecor(){
  if(S.view!=='card')return;const cur=getCard(S.caseId);const main=document.getElementById('main');if(!cur||!main)return;
  const X=xIndex(cur);const lis=main.querySelectorAll('ol.steps li, ul.steps li, .steps li');
  lis.forEach(li=>{
    const cl=li.cloneNode(true);cl.querySelectorAll('ol,ul,.xr').forEach(e=>e.remove());
    const txt=cl.textContent,found=new Map();
    const add=(t,card,cid,label)=>{if(!t&&!card)return;const key=(card?card.id:t.card.id)+'|'+(cid||'');if(found.has(key))return;found.set(key,{id:card?card.id:t.card.id,v:cid||'',label})};
    cl.querySelectorAll('b,strong').forEach(b=>{const t=xFindCase(b.textContent.replace(/[:：]\s*$/,''),X,cur);if(t&&!(t.card.id===cur.id&&t.id===curCaseId(cur)))add(t,null,t.id,t.card.id===cur.id?t.n:t.card.title+' › '+t.n)});
    for(const m of txt.matchAll(/(?:kasus|kartu)\s+([^.;:\n]+)/gi)){
      const w=m[1].trim().split(/\s+/).slice(0,12);let done=false;
      for(let n=w.length;n>=1&&!done;n--){const cand=w.slice(0,n).join(' ').replace(/[,]+$/,'');
        let t=xFindCase(cand,X,cur)||(/kasus/i.test(m[0])?xFindCasePrefix(cand,X,cur):null);
        if(t&&!(t.card.id===cur.id&&t.id===curCaseId(cur))){add(t,null,t.id,t.card.id===cur.id?t.n:t.card.title+' › '+t.n);done=true;break}
        if(/kartu/i.test(m[0])){const cc=xFindCard(cand,X,cur);if(cc){add(null,cc,'',cc.title);done=true;break}}}}
    if(!found.size)return;
    const row=document.createElement('div');row.className='xr';row.style.cssText='margin:6px 0 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center';
    row.innerHTML='<span class="hint" style="margin:0">Lanjut ke:</span>'+[...found.values()].map(f=>`<button type="button" class="btn chip" data-a="xgo" data-id="${esc(f.id)}" data-v="${esc(f.v)}">${esc(f.label)} →</button>`).join('');
    li.appendChild(row)})}

function condSearch(n,toks){
  if(n.length<3)return[];const nq=nn(n),qt=nq.split(' ').filter(t=>t.length>1&&!SR_STOP.has(t));const all=[];
  for(const c of cards()){if(c.status==='usang')continue;
    for(const it of condItems(c)){let best=0;
      for(const k of it.kw){const nk=nn(k);if(!nk)continue;let v=0;
        if(nq===nk)v=100;
        else if(nk.length>=4&&nq.includes(nk))v=60+nk.length/100;
        else if(nq.length>=6&&nk.includes(nq))v=40;
        else if(qt.length>=2&&qt.every(t=>nk.split(' ').some(w=>w===t||(t.length>=3&&w.startsWith(t)))))v=30+qt.length;
        if(v>best)best=v}
      if(best>=30)all.push({c,s:best,hits:[it.label],st:it.st,lab:it.label})}}
  if(!all.length)return[];all.sort((a,b)=>b.s-a.s);
  const top=all.filter(x=>Math.abs(x.s-all[0].s)<.001);
  if(top.every(x=>x.c.group==='produk')){const ord=id=>{const i=cards().findIndex(z=>z.id===id);return i<0?99:i};top.sort((a,b)=>ord(a.c.id)-ord(b.c.id));return top.slice(0,3)}
  return top.length<=3?top:[]}

function cdDrop(c,qk,ov){
  const all=ov===undefined;
  if(all)c.questions=c.questions.filter(q=>q.key!==qk);
  else{const q=c.questions.find(x=>x.key===qk);if(q)q.opts=q.opts.filter(o=>o[0]!==ov)}
  c.branches=c.branches.filter(b=>all||(b.when||{})[qk]!==ov);
  if(all)c.branches.forEach(b=>{if(b.when)delete b.when[qk]});
  let ch=true;
  while(ch){ch=false;
    for(const q of [...c.questions]){if(!q.showIf)continue;
      const arr=Array.isArray(q.showIf)?q.showIf:[q.showIf];
      const keep=arr.filter(o=>!(qk in o)||(!all&&o[qk]!==ov));
      if(keep.length!==arr.length){
        if(!keep.length){c.questions=c.questions.filter(x=>x!==q);c.branches=c.branches.filter(b=>(b.when||{})[q.key]===undefined);ch=true}
        else q.showIf=Array.isArray(q.showIf)?keep:keep[0]}}}
  if(all){const seen=new Set();c.branches=c.branches.filter(b=>{const k=JSON.stringify(b.when||{});if(seen.has(k))return false;seen.add(k);return true})}
  if(!c.branches.length)c.branches=[{label:'Ketentuan',when:{},steps:[],ticket:{kategori:'',tujuan:'',mode:'update'},desc1:'',desc2:''}];
}

    if(!c.tool)continue;const arr=cdArr(c);if(!arr)continue;
    if(!TDC[c.id])TDC[c.id]=arr.slice();
    const hid=c.td&&c.td.tool==='cases'?c.td.hidden:[];const ver=hid.join(',');
    if(TDCV[c.id]===ver)continue;TDCV[c.id]=ver;
    arr.splice(0,arr.length,...TDC[c.id].filter(x=>!hid.includes(x.id)));
  }
}
const hpOf=c=>c.hp||[];
function hidCount(c){return (c.td&&c.td.tool==='cases'?c.td.hidden.length:0)+hpOf(c).length}
function caseDecor(){
  const old=document.getElementById('casedel');if(old)old.remove();
  if(S.view!=='card')return;
  const c=getCard(S.caseId);if(!c)return;
  const main=document.getElementById('main');if(!main)return;
  // sembunyikan pill yang sudah dihapus (semua peran)
  const hp=hpOf(c);
  if(hp.length){const groups=new Set();
    main.querySelectorAll('.pills button[data-a][data-v]').forEach(p=>{if(hp.includes(p.dataset.a+'|'+p.dataset.v)){groups.add(p.dataset.a);p.remove()}});
    for(const g of groups){const ps=[...main.querySelectorAll('.pills button[data-a="'+g+'"]')];if(ps.length&&!ps.some(x=>x.classList.contains('on'))&&!main.__fixing){main.__fixing=1;ps[0].click();setTimeout(()=>{main.__fixing=0},0);return}}
  }
  if(S.role!=='admin')return;
  // tombol × pada setiap pill (Admin)
  const skip=new Set(['knak']);
  main.querySelectorAll('.pills button[data-a][data-v]').forEach(p=>{
    const a=p.dataset.a;if(skip.has(a)||p.querySelector('.pdx'))return;
    const grp=main.querySelectorAll('.pills button[data-a="'+a+'"]').length;if(grp<2)return;
    p.insertAdjacentHTML('beforeend','<span class="pdx" role="button" title="Hapus kondisi ini" data-a="pdel" data-pa="'+esc(a)+'" data-pv="'+esc(p.dataset.v)+'" data-pk="'+esc(p.dataset.k||'')+'">×</span>')});
  const d=document.createElement('div');d.id='casedel';d.className='tools';d.style.cssText='margin:8px 0;gap:8px;flex-wrap:wrap';
  let h='';
  if(!c.tool&&(c.branches||[]).length>1){const b=curBranch(c);if(b)h+=`<button type="button" class="btn bad" data-a="brdel" data-id="${esc(c.id)}">Hapus if case yang tampil</button>`}
  if(hidCount(c))h+=`<button type="button" class="btn" data-a="caserestore" data-id="${esc(c.id)}">Pulihkan kondisi yang dihapus (${hidCount(c)})</button>`;
  if(!h)return;d.innerHTML=h;
  const t=main.querySelector('.titlerow');if(t)t.insertAdjacentElement('afterend',d)
}

function tdRead(){

  const fd=new FormData($('#tdForm'));const g=n=>(fd.get(n)||'').toString();
  if(m.tool==='kanal'){
    const ch=m.d.kn.find(x=>x.id===m.d.sel);if(!ch)return;
    ch.n=g('n').trim();ch.g=g('g');ch.u=g('u')==='KAL'?'KAL':'HK';
    const e1=parseInt(g('e1'),10),e2=parseInt(g('e2'),10),un=ch.u==='KAL'?'hari kalender':'hari kerja';
    if(e1>=0)ch.e=(e2>e1)?e1+'–'+e2+' '+un:'H+'+e1+' '+un;else delete ch.e;
    const f=TD_LN(g('f')).map(l=>{const i=l.indexOf(': ');return i>0?[l.slice(0,i),l.slice(i+2)]:['',l]});if(f.length)ch.f=f;else delete ch.f;
    const nt=TD_LN(g('nt'));if(nt.length)ch.nt=nt;else delete ch.nt;
    const i=g('i').trim();if(i)ch.i=i;else delete ch.i;const h=g('h').trim();if(h)ch.h=h;else delete ch.h;
    const ak=[];(ch.ak||[]).forEach((a,j)=>{if(fd.has('a'+j+'_del'))return;ak.push({n:g('a'+j+'_n').trim()||'Akses',st:TD_LN(g('a'+j+'_st'))})});
    if(ak.length)ch.ak=ak;else delete ch.ak;
  }else{

function readForm(c){
  const fd=new FormData($('#cardForm'));const g=n=>(fd.get(n)||'').toString();
  const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  if(fd.has('group'))c.group=g('group');
  c.title=g('title').trim();c.short=g('short').trim();c.tujuan=g('tujuan').trim();
  c.note=g('note').trim();
  c.keywords=g('keywords').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  c.probing=lines(g('probing'));c.icrm=lines(g('icrm'));
  flat(c).forEach((e,i)=>{const b=e.u;
    b.steps=lines(g(`b${i}_steps`));b.ticket=Object.assign({},b.ticket,{kategori:g(`b${i}_kat`).trim(),tujuan:g(`b${i}_tuj`).trim()});
    b.desc1=g(`b${i}_d1`).trim();b.desc2=g(`b${i}_d2`).trim();
    const xs=xparse(g(`b${i}_x`));if(xs.length)b.extra=xs;else delete b.extra;
  });
  if(fd.has('title')&&document.querySelector('[name=usang]'))c.status=fd.has('usang')?'usang':'berlaku';
  return c;
}
function validateCard(c){
  if(!c.title)return'Judul wajib diisi.';
  for(const e of flat(c)){for(const k of ukeys(e.u)){if(!FIELDS[k])return`Isian {{${k}}} tidak dikenal. Gunakan: ${Object.keys(FIELDS).join(', ')}.`}}
  return'';
}
function restructure(c,group){
  const was=c.group;c.group=group;
  if(group==='informasi'&&c.questions.length){const b0=c.branches[0];b0.label='Ketentuan';b0.when={};c.questions=[];c.branches=[b0]}
  else if(group!=='informasi'&&!c.questions.length){const old=c.branches[0];const n=newCard(group);n.branches[0].steps=old.steps;n.branches[0].desc1=old.desc1;n.branches[0].desc2=old.desc2;n.branches[0].ticket=old.ticket;c.questions=n.questions;c.branches=n.branches;if(!c.icrm.length)c.icrm=clone(ICRM)}
  return was;
}

function showHTML(){

function startShow(){
  clearInterval(window.__lgt);const el=document.getElementById('lgshow');if(!el)return;
  let n=0;const go=i=>{n=i;el.querySelectorAll('.sl').forEach((e,k)=>{if(k===i){e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}else e.classList.remove('on')});el.querySelectorAll('.dots button').forEach((b,k)=>b.classList.toggle('on',k===i))};
  const tick=()=>{if(!document.getElementById('lgshow')){clearInterval(window.__lgt);return}if(!document.hidden)go((n+1)%SHOW.length)};
  el.querySelector('.dots').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;go(+b.dataset.i);clearInterval(window.__lgt);window.__lgt=setInterval(tick,6500)});
  window.__lgt=setInterval(tick,6500);
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-a=usang]'))H.usang(t);
  if(t.matches('input[data-pl]')){S.pl.d=t.value||S.pl.d;renderMain();return}
  if(t.matches('input[data-kd]')){S.kn.d=t.value||S.kn.d;renderMain()}
  if(t.matches('[data-chk]')){S.checks[t.dataset.chk]=t.checked;t.closest('.chk').classList.toggle('done',t.checked)}
  if(t.id==='grpSel'&&S.modal&&S.modal.type==='form'){const c=readForm(S.modal.card);restructure(c,t.value);S.modal.card=c;renderModal()}
  if(t.id==='ptIn'){ptAdd([...t.files]);t.value='';return}
  if(t.matches('[data-pt=name]')){PT().name=t.value;return}
  if(t.matches('[data-pt=small]')){PT().small=t.checked;return}
  if(t.id==='holFile'){
    const file=t.files[0];if(!file)return;
    file.text().then(x=>{try{
      const j=JSON.parse(x);if(!Array.isArray(j.holidays)||!j.holidays.length||j.holidays.some(h=>!/^\d{4}-\d{2}-\d{2}$/.test(h.d)))throw 0;
      DB.holidays=j.holidays.map(h=>({d:h.d,n:String(h.n||'')}));DB.holAt=Date.now();knHolReset();logAct('impor-libur',file.name);save();renderMain();toast('Impor berhasil: '+j.holidays.length+' tanggal');
    }catch(err){toast('File tidak valid')}});
  }
  if(t.id==='impFile'){
    const file=t.files[0];if(!file)return;
    file.text().then(x=>{try{
      const j=JSON.parse(x);if(!Array.isArray(j.cards)||j.cards.some(c=>!c.id||!c.title||!Array.isArray(c.branches)))throw 0;
      DB.cards={};j.cards.forEach(c=>{DB.cards[c.id]=c});if(Array.isArray(j.contacts)&&j.contacts.length)DB.contacts=j.contacts;
      logAct('impor',file.name);save();renderAll();toast('Impor berhasil: '+j.cards.length+' kartu');
    }catch(err){toast('File tidak valid')}});
  }
});

const SY_EMPTY=()=>({gm:{},qz:null,cards:{},drafts:{},contacts:null,brk:{},hol:JSON.stringify({l:null,a:null}),logTop:0});
function syncSnap(){
  const o=SY_EMPTY();
  for(const[k,v]of Object.entries(DB.cards||{}))o.cards[k]=JSON.stringify(v);
  for(const d of(DB.drafts||[]))o.drafts[d.id]=JSON.stringify(d);
  o.contacts=DB.contacts?JSON.stringify(DB.contacts):null;
  o.qz=DB.qz?JSON.stringify(DB.qz):null;
  for(const[k,v]of Object.entries(DB.gm||{}))o.gm[k]=JSON.stringify(v);
  for(const[k,v]of Object.entries(DB.brk||{}))o.brk[k]=v;
  o.hol=JSON.stringify({l:DB.holidays||null,a:DB.holAt||null});
  o.logTop=(DB.log&&DB.log[0]&&DB.log[0].t)||0;
  return o;
}
function syncOps(){
  if(!SYNC.snap)return[];
  const sn=SYNC.snap,ops=[];
  for(const[k,v]of Object.entries(DB.cards||{})){const j=JSON.stringify(v);if(sn.cards[k]!==j)ops.push({t:'cs',id:k,v})}
  for(const k of Object.keys(sn.cards))if(!(DB.cards&&k in DB.cards))ops.push({t:'cd',id:k});
  const dm={};for(const d of(DB.drafts||[]))dm[d.id]=d;
  for(const[k,v]of Object.entries(dm)){if(sn.drafts[k]!==JSON.stringify(v))ops.push({t:'ds',id:k,v})}
  for(const k of Object.keys(sn.drafts))if(!(k in dm))ops.push({t:'dd',id:k});
  const cj=DB.contacts?JSON.stringify(DB.contacts):null;if(cj&&cj!==sn.contacts)ops.push({t:'ct',v:DB.contacts});
  for(const[k,v]of Object.entries(DB.gm||{})){if(sn.gm[k]!==JSON.stringify(v))ops.push({t:'gs',id:k,v})}
  for(const k of Object.keys(sn.gm||{}))if(!(DB.gm&&k in DB.gm))ops.push({t:'gd',id:k});
  const qj=DB.qz?JSON.stringify(DB.qz):null;if(qj&&qj!==sn.qz)ops.push({t:'qz',v:DB.qz});
  const br=DB.brk||{};
  for(const[k,v]of Object.entries(br))if(sn.brk[k]!==v)ops.push({t:'bk',id:k,v});
  for(const k of Object.keys(sn.brk))if(!(k in br))ops.push({t:'bk',id:k,v:null});
  const hj=JSON.stringify({l:DB.holidays||null,a:DB.holAt||null});if(hj!==sn.hol)ops.push({t:'hl',v:{l:DB.holidays||null,a:DB.holAt||null}});
  const nl=(DB.log||[]).filter(x=>x.t>sn.logTop&&x.act!=='cari-tanpa-hasil').reverse();for(const l of nl)ops.push({t:'lg',v:l});
  return ops.filter(o=>(SY_ALLOW[o.t]||[]).includes(S.role)); // hanya kirim yang boleh ditulis peran ini
}
const SY_ALLOW={cs:['tl','admin'],cd:['tl','admin'],ds:['tl','trainer','admin'],dd:['tl','trainer','admin'],bk:['tl','admin'],ct:['admin'],hl:['admin'],lg:['tl','trainer','admin'],qz:['trainer','admin'],gs:['tl'],gd:['tl']};
function syNext(prev){const n=syncSnap();const ok=t=>(SY_ALLOW[t]||[]).includes(S.role);if(!prev)return n;
  if(!ok('cs')){n.cards=prev.cards}if(!ok('ds')){n.drafts=prev.drafts}if(!ok('ct')){n.contacts=prev.contacts}if(!ok('bk')){n.brk=prev.brk}if(!ok('hl')){n.hol=prev.hol}if(!ok('qz')){n.qz=prev.qz}if(!ok('gs')){n.gm=prev.gm||{}}return n}
function syncPush(){
  if(!SYNC.on||SYNC.busy||!S.role||S.role==='agent')return;
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(syncFlush,400);
}
async function syncFlush(){
  if(!SYNC.on||SYNC.busy||!S.role||S.role==='agent')return;
  let pin='';try{pin=sessionStorage.getItem('opal.pin')||''}catch(e){}
  if(!pin)return;
  const ops=syncOps();if(!ops.length)return;
  const next=syNext(SYNC.snap);SYNC.busy=true;
  try{
    const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:S.role,pin,ops})});
    if(r.ok){const j=await r.json();SYNC.snap=next;SYNC.rev=Math.max(SYNC.rev,j.rev||0);syncTag()}
    else if(r.status===401){toast('PIN tidak valid di server. Keluar lalu masuk lagi.')}
    else if(r.status===403){toast('Peran ini tidak diizinkan mengubah data tersebut.')}
    else toast('Perubahan belum tersinkron. Akan dicoba lagi.');
  }catch(e){toast('Tidak ada koneksi ke server. Perubahan akan dikirim saat tersambung.')}
  SYNC.busy=false;
  if(syncOps().length)SYNC.timer=setTimeout(syncFlush,15000);
}
function syncApply(j){
  if(S.role&&S.role!=='agent'&&syncOps().length)return false; // ada perubahan lokal belum terkirim, jangan ditimpa
  DB.cards=j.cards||{};
  DB.drafts=Object.values(j.drafts||{}).sort((a,b)=>(b.at||0)-(a.at||0));
  if(j.contacts&&Array.isArray(j.contacts)&&j.contacts.length)DB.contacts=j.contacts;else delete DB.contacts;
  DB.brk=j.brk||{};
  if(j.qz&&Array.isArray(j.qz.ids))DB.qz=j.qz;else delete DB.qz;
  DB.gm=j.gm||{};
  if(j.hol&&j.hol.l){DB.holidays=j.hol.l;DB.holAt=j.hol.a}else{delete DB.holidays;delete DB.holAt}
  DB.log=(j.log||[]).slice(0,300);
  try{knHolReset()}catch(e){}
  try{localStorage.setItem(CONFIG.KEY,JSON.stringify(DB))}catch(e){}
  SYNC.snap=syncSnap();SYNC.rev=j.rev||0;return true;
}
function syncTag(){const vt=document.getElementById('verTag');if(vt)vt.textContent=' · Versi '+SEED_REV+(SYNC.on?' · Tersinkron':'')}
async function syncPull(force){
  if(!SYNC.on&&!force)return;
  try{
    if(!force){const r=await fetch('/api/db?rev=1',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if((j.rev||0)<=SYNC.rev)return}
    const r=await fetch('/api/db',{cache:'no-store'});if(!r.ok){if(force)SYNC.on=false;return}
    const j=await r.json();
    if(force){
      SYNC.on=true;
      if(!j.rev&&!Object.keys(j.cards||{}).length){ // server masih kosong: pakai data lokal sebagai awal
        SYNC.rev=0;SYNC.snap=SY_EMPTY();syncTag();syncPush();return}
    }
    if(!syncApply(j))return;
    syncTag();
    const busy=S.modal||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    try{if(busy){renderContacts();renderChips()}else renderAll()}catch(e){}
  }catch(e){}
}
if(location.protocol!=='file:'){
  syncPull(true);
  setInterval(()=>{if(!document.hidden)syncPull(false)},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull(false)});
}

/* ====================== CEK PEMBARUAN ====================== */
(()=>{
  syncTag();
  if(location.protocol==='file:')return;
  const URLS=[location.pathname,CONFIG.KB_URL,CONFIG.HOL_URL];
  const base={};let shown=false;
  const sig=async u=>{try{const r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok)return 'x';return (r.headers.get('etag')||'')+'|'+(r.headers.get('last-modified')||'')+'|'+(r.headers.get('content-length')||'')}catch(e){return null}};
  const banner=msg=>{if(shown)return;shown=true;const b=document.createElement('div');b.className='fresh';b.setAttribute('role','alert');b.innerHTML='<span></span><button class="btn pri" type="button">Muat ulang</button><button class="btn" type="button" aria-label="Tutup">Nanti</button>';b.firstChild.textContent=msg;b.children[1].onclick=()=>location.reload();b.children[2].onclick=()=>{b.remove();setTimeout(()=>{shown=false},600000)};document.body.appendChild(b)};
  const check=async()=>{for(const u of URLS){const v=await sig(u);if(v===null)continue;if(!(u in base)){base[u]=v;continue}if(base[u]!==v){banner('Ada pembaruan SOP di OPAL. Muat ulang agar memakai aturan terbaru.');return}}};
  check();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  setInterval(()=>{if(!document.hidden)check()},300000);
  window.addEventListener('storage',e=>{if(e.key===CONFIG.KEY&&!SYNC.on)banner('Data OPAL diubah di tab lain. Muat ulang agar tampilan sinkron.')});
})();
})();
</script>
<script>
(()=>{const orb=document.getElementById('orb');if(!orb)return;const cv=orb.querySelector('.gcv'),iL=orb.querySelector('.ol'),iD=orb.querySelector('.od');if(!cv||!iL||!iD)return;
const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});if(!gl)return;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;uniform sampler2D tl,td;uniform vec2 res;uniform float t;uniform vec2 m;uniform float dk;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
vec3 smp(vec2 uv){vec3 a=texture2D(tl,uv).rgb,b=texture2D(td,uv).rgb;return mix(a,b,dk);}
float sat(vec3 c){return max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));}

void main(){
 vec2 p=(gl_FragCoord.xy/res)*2.-1.;float r=length(p);
 float al=smoothstep(1.,.965,r);if(al<=0.){gl_FragColor=vec4(0.);return;}

 vec3 baseD=c0*(1.-.72*s0);
 vec2 w1=vec2(fbm(p*1.6+vec2(t*.10,t*.07)),fbm(p*1.6+vec2(3.1,-t*.09)))-.5;
 vec2 w2=vec2(fbm(p*2.1+vec2(-t*.08,t*.11)+9.),fbm(p*2.1+vec2(5.7,t*.08)+9.))-.5;
 vec2 uA=rot(pm,(1.-r)*(.9*sin(t*.23)+.6))+w1*.55*env+vec2(sin(t*.17),cos(t*.13))*.12*env+m*.08;
 vec2 uB=rot(pm*1.18,-(1.-r)*(.9*sin(t*.19+2.)+.4))+w2*.6*env+vec2(cos(t*.15),sin(t*.21))*.14*env-m*.06;
 vec3 cA=hue(tx(uA),.35*sin(t*.4)),cB=hue(tx(uB),-.35*sin(t*.33+1.));
 float sA=smoothstep(.12,.5,sat(cA)),sB=smoothstep(.12,.5,sat(cB));
 float wA=.35+.65*(.5+.5*sin(t*.31)),wB=.35+.65*(.5+.5*cos(t*.27));

const sh=(ty,src)=>{const x=gl.createShader(ty);gl.shaderSource(x,src);gl.compileShader(x);return gl.getShaderParameter(x,gl.COMPILE_STATUS)?x:null};

 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)};
const start=()=>{try{tex(iL,0);tex(iD,1)}catch(e){return}
 gl.uniform1i(U('tl'),0);gl.uniform1i(U('td'),1);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uR,cv.width,cv.height);
 const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let tt=9,last=performance.now(),dk=document.documentElement.getAttribute('data-theme')==='dark'?1:0,raf=0,hov=0;
 orb.addEventListener('pointerenter',()=>hov=1);orb.addEventListener('pointerleave',()=>hov=0);
 let sp=1;

  const th=document.documentElement.getAttribute('data-theme')==='dark'?1:0;dk=rm?th:dk+(th-dk)*.2;

  if(!rm&&!document.hidden)raf=requestAnimationFrame(draw)};
 draw(performance.now());orb.classList.add('gl-on');
 new MutationObserver(()=>{cancelAnimationFrame(raf);last=performance.now();if(rm)draw(performance.now());else raf=requestAnimationFrame(draw)}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
 if(!rm){raf=requestAnimationFrame(draw);document.addEventListener('visibilitychange',()=>{if(!document.hidden){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(draw)}})}};

if(ready())start();else{let n=0;const f=()=>{if(++n===2)start()};iL.addEventListener('load',f);iD.addEventListener('load',f)}
})();
